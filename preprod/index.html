<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BreakOut — Tournament viewer</title>

<!-- PWA: install to home screen for standalone (no URL bar) experience.
     Tap browser menu → "Add to Home Screen" / "Install app". Launched from
     the home-screen icon, BreakOut runs full-screen without browser chrome. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ea002a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BreakOut">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  :root {
    --spm-primary: #ea002a;
    --spm-accent:  #0031a1;
    --bg:    #f3f3f3;
    --card:  #ffffff;
    --text:  #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --connector: #94a3b8;
    --drop: #f59e0b;
    --radius: 10px;
    --pill: 999px;
    /* On-screen zoom factor (0.4–1.5). Applied by JS as a CSS transform:
       scale() on each bracket SVG (see applyZoomToSvgs). The SVG itself
       always renders at natural 1:1 size; the compositor scales the
       finished layer. This is a deliberate change from the old viewBox-
       resize zoom, which broke <foreignObject> card positioning on WebKit
       (iOS) — cards drifted off their connector lines when zoomed. */
    --zoom: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  /* Move the page's scroll into a fixed-positioned inner container so the
     mobile URL bar isn't yanked back into view every time the user pans up
     a tiny bit inside the bracket. The browser tracks "body scrolled past
     top" to decide URL-bar visibility — if scroll happens inside an
     internal container, the body stays at top and the URL bar stays in
     whatever state the user last put it in. Pull-to-refresh is also
     disabled by this, which is fine because the bracket auto-refreshes via
     the 15s updated_at poll. */
  html, body { height: 100%; margin: 0; }
  /* Body is a fixed flex column. Header sits at the top (full viewport
     width, no horizontal scroll), .page-scroll fills the remaining space.
     This makes the header pin to the viewport regardless of how far the
     user pans horizontally inside the bracket canvas — sticky-positioned
     elements inside a scroll container slide horizontally with the
     scroll, which is why the previous setup made the banner appear to
     scroll off-screen during a right-pan. */
  body {
    position: fixed; inset: 0; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .page-scroll {
    /* Single 2-axis scroll container for the whole tournament. Sits below
       the (now extracted) header and fills the rest of the body via flex. */
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    /* contain prevents overscroll from chaining up to the body (which would
       defeat the whole point on Chrome Mobile) and disables pull-to-refresh
       on Android. */
    overscroll-behavior: contain;
    /* Hide native scrollbars — the bracket UI is pan-driven on touch and
       click-drag on desktop. Content still scrolls programmatically. */
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .page-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; }

  .header {
    background: linear-gradient(135deg, var(--spm-primary), var(--spm-accent));
    color: #fff; padding: 14px 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    /* Sits outside .page-scroll now (direct body child via flex column),
       so it spans the full viewport width and stays pinned at top without
       any sticky positioning — which had a bug where it would slide
       horizontally with .page-scroll's scrollLeft during a right-pan. */
    flex: 0 0 auto;
    z-index: 10;
  }
  .header-inner {
    max-width: 1500px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .header h1 {
    font-size: 1.25rem; font-weight: 900; letter-spacing: -0.01em;
    display: inline-flex; align-items: center; gap: 8px;
    user-select: none;
  }
  .brand-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.25); }
  .badge { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 9px; border-radius: var(--pill); background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.45); }
  .header-spacer { flex: 1 1 auto; }

  /* Search */
  .search { position: relative; flex: 0 1 280px; min-width: 180px; }
  .search input { width: 100%; background: rgba(255,255,255,0.16); border: 1.5px solid rgba(255,255,255,0.4); color: #fff; font: inherit; font-size: 0.86rem; padding: 6px 30px 6px 32px; border-radius: var(--pill); outline: none; }
  .search input::placeholder { color: rgba(255,255,255,0.7); }
  .search input:focus { background: rgba(255,255,255,0.24); border-color: rgba(255,255,255,0.75); }
  .search svg.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; opacity: 0.7; pointer-events: none; }
  .search button.search-x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: transparent; border: 0; cursor: pointer; color: rgba(255,255,255,0.75); font-size: 1.1rem; width: 22px; height: 22px; border-radius: 50%; display: none; align-items: center; justify-content: center; line-height: 1; padding: 0; }
  .search.has-value button.search-x { display: inline-flex; }
  .search button.search-x:hover { background: rgba(255,255,255,0.18); color: #fff; }
  .search-result { font-size: 0.72rem; color: rgba(255,255,255,0.88); padding: 0 4px; }

  /* Zoom + print toolbar (lives in the sticky header). Buttons are sized
     for thumb taps on touch. Disabled state when zoom is at extreme. */
  .view-tools {
    display: flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,0.10);
    border: 1.5px solid rgba(255,255,255,0.35);
    border-radius: var(--pill);
    padding: 2px 4px;
  }
  .view-tools button {
    background: transparent; border: 0; color: #fff;
    width: 30px; height: 30px;
    border-radius: 50%;
    font: inherit; font-weight: 800; font-size: 1rem;
    cursor: pointer; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.12s;
  }
  .view-tools button:hover:not(:disabled) { background: rgba(255,255,255,0.22); }
  .view-tools button:disabled { opacity: 0.4; cursor: default; }
  .view-tools .zoom-label {
    color: #fff; font-size: 0.74rem; font-weight: 700;
    min-width: 38px; text-align: center;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  .view-tools .divider { width: 1px; height: 18px; background: rgba(255,255,255,0.35); margin: 0 2px; }
  .view-tools .print-btn {
    width: auto; padding: 0 10px;
    font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase;
    border-radius: 14px; font-weight: 700;
  }
  @media (max-width: 600px) {
    .view-tools .print-btn span.full { display: none; }
  }

  /* Print orientation popover — small menu pinned below the Print button. */
  .view-tools .print-wrap { position: relative; }
  .view-tools .print-popover {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    padding: 4px;
    min-width: 160px;
    z-index: 50;
    display: flex; flex-direction: column;
  }
  .view-tools .print-popover[hidden] { display: none; }
  .view-tools .print-popover-opt {
    display: flex; align-items: center; gap: 10px;
    background: transparent; border: 0; border-radius: 6px;
    padding: 9px 12px; cursor: pointer;
    color: var(--text); font: inherit; font-size: 0.9rem; font-weight: 600;
    text-align: left;
    width: 100%;
  }
  .view-tools .print-popover-opt:hover { background: rgba(0,49,161,0.08); color: var(--spm-accent); }
  .view-tools .print-popover-opt .opt-icon { font-size: 1.05rem; line-height: 1; width: 18px; text-align: center; color: var(--spm-accent); }
  /* Hide the orientation popover on touch-only devices — mobile Chromium
     ignores the @page orientation hint anyway, so the choice is misleading.
     JS short-circuits the Print button to fire directly on those devices.
     This rule is belt-and-suspenders in case JS detection misses an edge case. */
  @media (hover: none) and (pointer: coarse) {
    .view-tools .print-popover { display: none !important; }
  }

  /* Print: one bracket per page, fitted to page dimensions WITHOUT touching
     the on-screen UI.
     SVG viewBox makes this trivial: each .bracket-svg has width/height = 100%
     and a fixed viewBox in design units. In @media print we make the wrap
     and svg fill the page, and the browser fits viewBox content to that box.
     No zoom hacks, no transform scaling, no per-section measurement. */
  /* Print: stripped down for mobile reliability.
     Mobile Chromium / Samsung Internet ignore @page size hints, ignore
     vh resolved against page area, and don't fully unwind the fixed-body
     screen layout. So we lean on what DOES work everywhere:
       • Strip the screen layout (position: static, overflow: visible).
       • Section flows naturally: title at top, SVG below.
       • SVG uses width:100% height:auto — its viewBox preserves aspect
         and gives the wrapper its natural height, no vh needed.
       • page-break-inside: avoid keeps title and bracket together. */
  @media print {
    .header, .hero, .save-toast, .update-overlay, .foot,
    .view-tools, .search, #searchResult, .header-spacer { display: none !important; }
    body { background: #fff; }
    html, body, .page-scroll {
      position: static !important;
      overflow: visible !important;
      height: auto !important;
      width: auto !important;
      inset: auto !important;
      margin: 0 !important;
    }
    .bracket-section {
      page-break-after: always; break-after: page;
      page-break-inside: avoid; break-inside: avoid;
      padding: 0; margin: 0;
      overflow: hidden;
    }
    .bracket-section:last-child { page-break-after: auto; break-after: auto; }
    .bracket-section .section-title { padding: 6px 8px; }
    .bracket-section .viewport {
      overflow: visible !important;
      padding: 0 !important;
      cursor: default !important;
    }
    .bracket-section .bracket-wrap {
      display: block !important;
      width: 100% !important;
      height: auto !important;
      min-width: 0 !important;
      /* Strip the screen-only pan-canvas padding (option-A 2× canvas) so
         the SVG fills the page width instead of sitting in a 4× empty box. */
      padding: 0 !important;
    }
    .bracket-section .bracket-svg {
      display: block;
      width: 100% !important;
      height: auto !important;
      /* Cap at 7in tall so wide-aspect brackets don't overflow landscape
         page height (page content area for Letter landscape with 0.35in
         margins is 7.8in tall). 7in leaves room for the section-title.
         Portrait brackets naturally come in under this. */
      max-height: 7in !important;
      margin: 0 auto !important;
      /* Drop the on-screen zoom transform for print — paper fit comes from
         the viewBox (width:100% + height:auto), not the screen scale(). */
      transform: none !important;
    }
    /* Re-enable visible borders for paper output */
    .match { box-shadow: none !important; }
  }
  @page { size: auto; margin: 0.35in; }


  /* Tournament hero — large title + supporting metadata below the
     org banner. Non-sticky on purpose: scrolls away so the bracket gets
     full vertical space mid-play. */
  .hero {
    background: linear-gradient(180deg, #fff 0%, var(--bg) 100%);
    padding: 28px 18px 18px;
    border-bottom: 1px solid var(--border);
    /* width: 100vw spans the viewport horizontally; hero-inner inside
       (max-width: 1500px, margin: 0 auto) centers content within that
       span. The horizontal pin is done in JS (see pinTitlesToViewport)
       via transform: translateX(scrollLeft) because CSS sticky requires
       the parent to be larger than the sticky element — which isn't the
       case here (hero parent == 100vw, hero == 100vw). */
    width: 100vw;
    box-sizing: border-box;
    z-index: 4;
    will-change: transform;
  }
  .hero-inner {
    max-width: 1500px;
    margin: 0 auto;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .hero-status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 0.7rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.12em;
    padding: 3px 11px;
    border-radius: 999px;
    background: rgba(22,163,74,0.12);
    color: #15803d;
    margin-bottom: 6px;
  }
  .hero-status .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: #15803d;
    animation: heroPulse 1.6s ease-in-out infinite;
  }
  @keyframes heroPulse {
    0%, 100% { transform: scale(1);   opacity: 1;   }
    50%      { transform: scale(1.5); opacity: 0.5; }
  }
  .t-name {
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 0;
    background: linear-gradient(90deg, var(--spm-primary), var(--spm-accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .t-meta {
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.01em;
    line-height: 1.4;
  }
  .t-meta .sep { color: var(--border-strong); margin: 0 6px; }
  @media (max-width: 767px) {
    .hero { padding: 18px 14px 14px; }
    .t-name { font-size: 1.5rem; }
    .t-meta { font-size: 0.84rem; }
    .t-meta .sep { margin: 0 4px; }
  }

  /* Bracket sections (stacked vertically) */
  .bracket-section { padding: 14px 0 4px; border-bottom: 1px solid var(--border); }
  .bracket-section:last-of-type { border-bottom: 0; }
  .section-title {
    padding: 4px 18px 8px;
    font-size: 0.86rem; font-weight: 800; letter-spacing: 0.02em;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    color: var(--spm-accent);
    /* width: 100vw spans the viewport; justify-content: center centers
       the pill. The horizontal pin (so the title stays centered while
       the bracket pans) is done in JS via transform: translateX(scrollLeft)
       — CSS sticky doesn't work here because the section box is also
       100vw wide, leaving sticky no range to operate in. */
    width: 100vw;
    box-sizing: border-box;
    background: var(--bg);
    z-index: 5;
    will-change: transform;
  }
  .section-title .pill {
    display: inline-block; font-size: 0.66rem; font-weight: 800;
    color: #fff; background: var(--spm-accent);
    padding: 2px 9px; border-radius: var(--pill);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .section-title .pill.alt { background: var(--spm-primary); }
  .section-title .pill.consolation { background: #6b7280; }
  .section-title .desc { font-weight: 600; color: var(--muted); font-size: 0.78rem; }

  /* Each bracket section gets a horizontal-scroll viewport. It also acts as
     a pan surface: click-drag to scroll, Shift+wheel for mouse, arrow keys
     when focused. Native touch scrolling handles mobile. */
  .viewport {
    /* As of v0.78: the per-section viewport no longer owns its own scroll
       — the parent .page-scroll is the single 2-axis scroll container for
       the whole tournament. This lets the three brackets feel like one
       page (Option A). The .viewport stays as a styling/padding wrapper
       and as the binding target for click-drag pan + pinch handlers
       (they redirect scroll to .page-scroll).
       overflow MUST stay visible: .viewport is only viewport-width (a
       block element does not widen to fit wide content), so the bracket
       — which is far wider — overflows it on purpose, and THAT overflow
       is what gives .page-scroll its horizontal scroll range. v0.90
       wrongly set this to hidden to clip a stray SVG box; that clipped
       the whole bracket to viewport width and killed horizontal panning.
       The clip belongs on .bracket-wrap (the zoom sizer), not here. */
    overflow: visible;
    padding: 4px 16px 24px;
    cursor: grab;
    outline: none;
    /* touch-action: none — this viewport owns ALL touch gestures in JS
       (one-finger pan + two-finger pinch; see setupPanScroll). Native
       touch scrolling of the nested .page-scroll container is unreliable
       on iOS Safari under a position:fixed <body>, so we drive the pan
       ourselves via programmatic scrolling, which works everywhere. */
    touch-action: none;
  }
  .viewport::-webkit-scrollbar { display: none; height: 0; }
  .viewport.panning { cursor: grabbing; user-select: none; }
  .viewport:focus-visible { box-shadow: inset 0 0 0 2px rgba(0,49,161,0.45); border-radius: 4px; }
  /* Cards keep default cursor so users can read text without the grab hint. */
  .viewport .match { cursor: default; }

  /* Bracket wrap holds one big SVG per section. Cards live inside the SVG
     as <foreignObject> so they keep their HTML/CSS rendering (ellipsis,
     hover, container queries).
     The wrap doubles as the zoom "sizer" — JS sets its explicit
     width/height to design × zoom so .page-scroll gets honest scroll
     overflow in BOTH axes. The SVG inside renders at natural 1:1 size and
     is scaled by a CSS transform (a transform alone does NOT resize the
     layout box, hence the separate sizer).
     overflow: hidden clips the natural-size SVG box — larger than this
     sizer at zoom < 1 — to the sizer's exact bounds, so the stray box
     can't inflate .page-scroll's scroll area with empty space. Clipping
     HERE is correct because the sizer is exactly as wide as the zoomed
     bracket; clipping on .viewport (only viewport-width) amputates it. */
  .bracket-wrap {
    position: relative;
    display: block;
    overflow: hidden;
    /* Width/height = --zoom × natural-content size, set inline by JS. */
  }
  .bracket-svg {
    display: block;
    overflow: visible;
    /* Zoom transform is applied inline by applyZoomToSvgs(). Scale from the
       top-left so the SVG's painted box starts flush at the wrap's 0,0 and
       exactly fills the sizer. */
    transform-origin: 0 0;
  }
  .bracket-svg text.cross-source-link {
    /* bounding-box (not auto) so the whole text bbox catches the pointer —
       not just the painted glyph pixels. Otherwise hovering "between"
       letters or near the underline falls through to the viewport's grab
       cursor and clicks start a pan instead of firing the jump handler.
       Mobile taps were forgiving enough to land on a glyph; desktop mice
       are precise and missed. */
    pointer-events: bounding-box;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }
  .bracket-svg text.cross-source-link:hover { fill: #7c3a04; }
  .bracket-svg text.round-name {
    font-size: 13.5px; font-weight: 900;
    fill: var(--spm-accent);
    letter-spacing: 1.4px;
    text-transform: uppercase;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .bracket-svg .round-tables-bg { fill: rgba(0,49,161,0.10); }
  .bracket-svg text.round-tables {
    font-size: 9.5px; font-weight: 800;
    fill: var(--spm-accent);
    letter-spacing: 0.95px;
    text-transform: uppercase;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  .bracket-svg .round-divider {
    stroke: var(--border-strong);
    stroke-width: 1;
    stroke-dasharray: 4 4;
    fill: none;
  }
  .bracket-svg .round-header-underline {
    stroke: var(--border);
    stroke-width: 1;
  }

  /* ── Match cell ─────────────────────────────
     Layout best practices, applied:
       • Team names get the most prominent type and space (primary info).
       • Match # + destination chips share ONE compact top row (secondary).
       • Schedule + table share ONE compact footer line (tertiary).
       • Left edge has a 3px bracket-color stripe for instant identification.
     Fixed card size — driven by the foreignObject's width/height in SVG. */
  .match {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: box-shadow 0.18s ease, border-color 0.18s ease;
    /* Each card is its own container so the collision-driven hide rules
       below trigger based on the CARD'S own width — independent of zoom,
       window size, or mobile vs desktop. */
    container-type: inline-size;
    container-name: card;
  }
  /* Seed numbers are intentionally hidden from the bracket viewer; admin
     and staff UIs still show them where useful. */
  .match .match-row .seed { display: none !important; }
  /* Team-name font size scales with the visually-rendered card width. The
     SVG/foreignObject sandwich means the @container approach doesn't see
     the effective rendered width — so we toggle hide classes (and bump the
     CSS var --name-size) per zoom band from JS in updateCardDensity(). */
  .match .match-row .name { font-size: var(--name-size, 0.92rem); }
  /* Progressive hide bands set by JS on the .match element. Order matches
     the operator's priority: match # → day → team-num → time → chips. */
  .match.cw-le-220 .match-top .mno { display: none; }
  .match.cw-le-200 .match-foot .when .day { display: none; }
  /* When team-num is hidden, the 3-col grid (44px | 1fr | 18px) leaves the
     name in the 44px slot — squishing it. Drop the team-num track so name
     gets the full 1fr column. Same fix shape as v0.59's seed-track drop. */
  .match.cw-le-180 .match-row .team-num { display: none; }
  .match.cw-le-180 .match-row { grid-template-columns: 1fr 18px; }
  .match.cw-le-150 .match-foot .when .time { display: none; }
  .match.cw-le-130 .match-top .destinations { display: none; }
  .match:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.10); }

  /* Bracket-color stripe down the left edge — quick visual id per bracket.
     Rendered as an inline div so it works through foreignObject reliably. */
  .match .match-stripe {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--stripe, var(--border-strong));
    z-index: 1;
    pointer-events: none;
  }

  /* Top: M# left, destination chips right. Single row, compact. */
  .match-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    padding: 5px 10px 5px 13px;
    background: linear-gradient(180deg, #fafbfc, #f4f5f7);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .match-top .mno {
    color: var(--spm-accent);
    font-weight: 900;
    font-size: 0.92rem;
    letter-spacing: -0.005em;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
  }
  .match-top .destinations { display: flex; gap: 4px; align-items: center; }

  /* Destination chips — clickable pills that jump to the linked match. */
  .dest-chip {
    display: inline-flex; align-items: center;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 0.62rem; font-weight: 800;
    letter-spacing: 0.04em;
    text-decoration: none;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  a.dest-chip { cursor: pointer; }
  .dest-chip.win        { background: rgba(21,128,61,0.10);  color: #15803d; }
  a.dest-chip.win:hover { background: rgba(21,128,61,0.20); }
  .dest-chip.lose       { background: rgba(180,83,9,0.10);  color: #b45309; }
  a.dest-chip.lose:hover{ background: rgba(180,83,9,0.20); }
  .dest-chip.bracket-champ {
    background: linear-gradient(135deg, var(--spm-primary), var(--spm-accent));
    color: #fff;
    font-size: 0.7rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    padding: 4px 11px;
    border-radius: 6px;
    box-shadow: 0 3px 8px rgba(234,0,42,0.30);
    text-shadow: 0 1px 1px rgba(0,0,0,0.10);
  }

  /* Team rows — the primary content. Bigger type, breathing room. */
  .match-rows { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .match-row {
    display: grid;
    /* 3 tracks: team-num badge | team name | trophy. Seed column dropped
       in v0.59 — seed was hidden via display:none but its 22px track was
       still reserved, shifting every child one column to the left and
       squishing the badge + truncating the name. */
    grid-template-columns: 44px 1fr 18px;
    gap: 8px;
    align-items: center;
    padding: 0 10px 0 13px;
    font-size: 0.95rem;
    line-height: 1.15;
    flex: 1 1 0;
    min-height: 0;
    transition: background 0.15s ease;
  }
  @media (max-width: 767px) { .match-row { font-size: 0.88rem; padding: 0 8px 0 11px; } }
  .match-row + .match-row { border-top: 1px solid var(--border); }
  .seed     { color: var(--muted); font-size: 0.72rem; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .team-num { font-family: 'SF Mono', Consolas, Menlo, monospace; font-variant-numeric: tabular-nums; font-size: 0.74rem; font-weight: 700; color: var(--spm-accent); background: rgba(0,49,161,0.08); padding: 2px 6px; border-radius: 6px; text-align: center; }
  .name     { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trophy   { font-size: 0.95rem; opacity: 0; line-height: 1; text-align: right; }
  .match-row.winner          { background: rgba(21,128,61,0.05); }
  .match-row.winner .name    { font-weight: 800; }
  .match-row.winner .trophy  { opacity: 1; }
  .match-row.loser           { opacity: 0.52; }
  .match-row.loser .name     { font-weight: 500; }
  .match-row.loser .team-num { color: var(--muted); background: rgba(0,0,0,0.04); }

  /* Footer: schedule on left, table on right. One line, compact. */
  .match-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    padding: 4px 10px 4px 13px;
    border-top: 1px solid var(--border);
    background: #fafafa;
    flex: 0 0 auto;
    font-size: 0.62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted);
  }
  .match-foot .when     { display: flex; gap: 6px; align-items: center; min-width: 0; flex: 1 1 auto; overflow: hidden; white-space: nowrap; }
  .match-foot .when .day { color: var(--muted); }
  .match-foot .when .time{ color: var(--text); font-weight: 800; font-variant-numeric: tabular-nums; }
  .match-foot .when .pay { color: #15803d; font-weight: 900; font-variant-numeric: tabular-nums; }
  .match-foot .table     { color: var(--spm-accent); font-weight: 800; flex: 0 0 auto; }

  /* Bye card — de-emphasized version of a match card. Same dimensions so
     card spacing stays uniform, but lighter background, italic "BYE" row,
     and the seeded team's advancement arrow instead of a W/L chip. */
  .match.bye { background: linear-gradient(180deg, #fafbfc, #f4f5f7); }
  .match.bye .mno {
    color: var(--spm-accent);
    font-weight: 900;
    font-size: 0.92rem;
  }
  .match.bye .bye-tag {
    margin-left: 8px;
    color: var(--muted);
    font-weight: 800;
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(0,0,0,0.05);
    vertical-align: middle;
  }
  .match.bye .match-row.winner { background: rgba(0,49,161,0.04); }
  .match.bye .match-row.winner .trophy {
    opacity: 1; color: var(--spm-accent); font-weight: 900;
    font-size: 1.05rem;
  }
  .match.bye .match-row.bye-row .name {
    color: var(--muted); font-style: italic; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    font-size: 0.78rem;
  }
  .match.bye .match-row.bye-row .seed,
  .match.bye .match-row.bye-row .team-num {
    opacity: 0.45; background: transparent; color: var(--muted);
  }

  /* Staff mode — banner + clickable match cards + score-entry modal. */
  .staff-banner {
    background: linear-gradient(180deg, #ea8c00, #d97400);
    color: #fff;
    padding: 8px 18px;
    font-size: 0.84rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 10px; justify-content: center;
    /* Inserted by setupStaffMode as a sibling of the header, both outside
       .page-scroll. Flex item, no sticky needed. */
    flex: 0 0 auto;
    z-index: 9;
    box-shadow: 0 2px 6px rgba(0,0,0,0.10);
  }
  .staff-banner .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.35); }

  body.staff .match:not(.bye) { cursor: pointer; }
  body.staff .match:not(.bye):hover { box-shadow: 0 6px 18px rgba(217,116,0,0.20); border-color: #d97400; }

  .staff-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,20,40,0.55);
    z-index: 9998;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .staff-modal-overlay.shown { display: flex; }
  .staff-modal {
    background: #fff; border-radius: 12px;
    width: 100%; max-width: 440px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.30);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .staff-modal-head { padding: 14px 18px 10px; background: linear-gradient(180deg, #fafbfc, #f4f5f7); border-bottom: 1px solid var(--border); }
  .staff-modal-head .mno { font-size: 1.05rem; font-weight: 900; color: var(--spm-accent); }
  .staff-modal-head .ctx { font-size: 0.74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }
  .staff-modal-body { padding: 16px 18px; }
  .staff-modal-body .q { font-size: 0.84rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 10px; }
  .staff-overrides {
    display: grid;
    grid-template-columns: 1fr 88px auto;
    gap: 8px;
    align-items: end;
    padding: 10px 12px;
    background: #fafbfc;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .staff-overrides label {
    display: flex; flex-direction: column; gap: 3px;
    font-size: 0.7rem; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .staff-overrides input, .staff-overrides select {
    padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: 5px;
    font-size: 0.86rem; font-family: inherit; background: #fff;
  }
  .staff-overrides .dt-pair { display: flex; gap: 4px; align-items: center; }
  .staff-overrides .dt-pair input[type="date"] { flex: 1 1 auto; min-width: 110px; }
  .staff-overrides .dt-pair select { flex: 0 0 auto; min-width: 100px; }
  .staff-btn.save { background: var(--spm-accent); color: #fff; border-color: var(--spm-accent); }
  .staff-btn.save:hover { opacity: 0.92; }
  .staff-btn.save.success { background: var(--success); border-color: var(--success); }
  .staff-team-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #fff;
    border: 2px solid var(--border-strong);
    border-radius: 8px;
    font-size: 0.94rem; font-weight: 700; color: var(--text);
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .staff-team-btn:hover:not(:disabled) { border-color: var(--spm-accent); background: rgba(0,49,161,0.04); transform: translateY(-1px); }
  .staff-team-btn:disabled { cursor: not-allowed; opacity: 0.5; }
  .staff-team-btn.is-winner {
    border-color: #15803d; background: rgba(21,128,61,0.08); color: #15803d;
  }
  .staff-team-btn .seed { font-size: 0.7rem; color: var(--muted); font-weight: 600; min-width: 24px; }
  .staff-team-btn.is-winner .seed { color: #15803d; }
  .staff-team-btn .team-num { font-family: 'SF Mono', Consolas, Menlo, monospace; font-size: 0.72rem; font-weight: 700; color: var(--spm-accent); background: rgba(0,49,161,0.08); padding: 2px 6px; border-radius: 5px; }
  .staff-team-btn .name { flex: 1 1 auto; }
  .staff-team-btn .check { color: #15803d; font-weight: 900; font-size: 1.05rem; display: none; }
  .staff-team-btn.is-winner .check { display: inline; }
  .staff-team-btn .tbd { color: var(--muted); font-style: italic; font-weight: 600; font-size: 0.84rem; }
  .staff-modal-actions {
    display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--border); background: #fafbfc;
    align-items: center;
  }
  .staff-modal-actions .spacer { flex: 1 1 auto; }
  .staff-btn {
    padding: 7px 14px; font-size: 0.84rem; font-weight: 700;
    border-radius: 6px; cursor: pointer; border: 1px solid var(--border-strong);
    background: #fff; color: var(--text);
    transition: background 0.15s;
  }
  .staff-btn:hover { background: var(--bg); }
  .staff-btn.clear { border-color: #b45309; color: #b45309; }
  .staff-btn.clear:hover { background: rgba(180,83,9,0.08); }
  .staff-btn.clear:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Save toast — confirms PATCH succeeded. */
  .save-toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #15803d; color: #fff;
    padding: 9px 16px; border-radius: 8px;
    font-size: 0.84rem; font-weight: 700;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    z-index: 10000;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .save-toast.shown { opacity: 1; transform: translateY(0); }
  .save-toast.err { background: var(--spm-primary); }

  /* Jump-to flash — when a dest chip is clicked, the target match
     pulses with an SPM red glow for 1.8s. */
  /* Jump-to-match highlight — visually identical to search "latest" hit so
     clicking W/L and a search current-match pulse look the same. Card
     background pulses red; SVG halo pulses red ring outside foreignObject
     clip. Animations defined further down with the search keyframes; we
     just point the jump-specific classes at the same animations. */
  .match.match-jump-flash {
    animation: searchLatestBgPulse 2.4s ease-out forwards;
    background: rgba(234,0,42,0.10);
    border-color: var(--spm-primary);
  }
  .bracket-svg .match-jump-overlay {
    fill: none;
    stroke: #ea002a;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(234,0,42,0.55));
    animation: searchLatestPulse 2.4s ease-out forwards;
  }

  /* Bracket Champ — promoted OUT of the card so it can be loud. Sits in
     the final round's column, centered under the final match. Pulses
     gently to draw the eye. Same SPM gradient as the in-card pill version
     used to be, but ~2× the size and with a soft red halo.
     Positioned by the foreignObject wrapping it in SVG coordinates. */
  .bracket-champ-big {
    display: inline-block;
    padding: 11px 22px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--spm-primary), var(--spm-accent));
    color: #fff;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.96px;
    text-transform: uppercase;
    text-shadow: 0 1px 1px rgba(0,0,0,0.18);
    white-space: nowrap;
    box-shadow:
      0 10px 24px rgba(234,0,42,0.32),
      0 0 0 4px rgba(234,0,42,0.10),
      0 0 0 8px rgba(0,49,161,0.06);
    animation: champBounce 2.4s ease-in-out infinite;
    pointer-events: none;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @keyframes champBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-4px) scale(1.05); }
  }

  /* Final-of-each-bracket emphasis: gradient top-strip on the card,
     deeper winner-row tint, and the winning team's name in SPM blue.
     The bracket-champ chip in the top-right already carries the gold
     treatment — this gives the whole card a "this is the final" feel
     without competing with non-final winner cells. */
  .match.is-final-of-bracket::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--spm-primary), var(--spm-accent));
    z-index: 2;
    pointer-events: none;
  }
  .match.is-final-of-bracket .match-row.winner {
    background: linear-gradient(90deg, rgba(234,0,42,0.10), rgba(0,49,161,0.10));
  }
  .match.is-final-of-bracket .match-row.winner .name {
    color: var(--spm-accent);
    font-weight: 900;
  }
  .match.is-final-of-bracket .match-row.winner .trophy {
    font-size: 1.05rem;
  }

  /* Search match highlight — uses the same SVG-halo trick as jump-to-match
     so the highlight actually radiates beyond the card's foreignObject clip.
     The card itself gets a tinted background (contained inside the box, not
     clipped) so each match-row reads as "found" even when the SVG halo is
     far away. */
  .match.match-hit { background: rgba(0,49,161,0.08); border-color: var(--spm-accent); }
  .match.match-hit-latest {
    background: rgba(234,0,42,0.10);
    border-color: var(--spm-primary);
    animation: searchLatestBgPulse 2.4s ease-out forwards;
  }
  @keyframes searchLatestBgPulse {
    0%, 100%       { background: rgba(234,0,42,0.10); }
    6%, 36%, 66%   { background: rgba(234,0,42,0.22); }
    20%, 50%, 80%  { background: rgba(234,0,42,0.10); }
  }

  /* SVG halos drawn outside each card's foreignObject (in the bracket-svg
     coordinate space) so they actually paint where the user can see them.
     All hits get a steady blue ring; the latest hit (the one we scroll to)
     pulses red 3 times then settles into a brighter red ring. */
  .bracket-svg .search-hit-halo {
    fill: none;
    stroke: var(--spm-accent);
    stroke-width: 4;
    stroke-opacity: 0.7;
    pointer-events: none;
  }
  .bracket-svg .search-hit-latest-halo {
    fill: none;
    stroke: #ea002a;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(234,0,42,0.55));
    animation: searchLatestPulse 2.4s ease-out forwards;
  }
  @keyframes searchLatestPulse {
    0%             { stroke-opacity: 0;    stroke-width: 0; }
    6%, 36%, 66%   { stroke-opacity: 1;    stroke-width: 10; }
    20%, 50%, 80%  { stroke-opacity: 0.5;  stroke-width: 4; }
    100%           { stroke-opacity: 1;    stroke-width: 5; }
  }

  /* Team-path highlight (viewer mode) — click any team row to spotlight all
     of that team's matches. Win = green border + tint, loss = red, pending
     (not yet scored) = SPM blue. The team's own row inside each card gets
     a stronger background to draw the eye. */
  body:not(.staff) .match-row[data-team-num] { cursor: pointer; }
  body:not(.staff) .match-row[data-team-num]:hover { background: rgba(0,49,161,0.04); }
  .match.highlight-win {
    border-color: #15803d;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.40), 0 2px 10px rgba(0,0,0,0.08);
  }
  .match.highlight-loss {
    border-color: var(--spm-primary);
    box-shadow: 0 0 0 3px rgba(234,0,42,0.40), 0 2px 10px rgba(0,0,0,0.08);
  }
  .match.highlight-pending {
    border-color: var(--spm-accent);
    box-shadow: 0 0 0 3px rgba(0,49,161,0.30), 0 2px 10px rgba(0,0,0,0.06);
  }
  .match-row.highlight-team        { background: rgba(0,49,161,0.08) !important; }
  .match.highlight-win  .match-row.highlight-team { background: rgba(22,163,74,0.14) !important; }
  .match.highlight-loss .match-row.highlight-team { background: rgba(234,0,42,0.12) !important; }
  /* Keep final-card top-strip visible above highlight shadows */
  .match.is-final-of-bracket.highlight-win,
  .match.is-final-of-bracket.highlight-loss,
  .match.is-final-of-bracket.highlight-pending { box-shadow: 0 0 0 3px rgba(0,0,0,0.05), 0 2px 10px rgba(0,0,0,0.08); }
  .match.is-final-of-bracket.highlight-win  { box-shadow: 0 0 0 3px rgba(22,163,74,0.50), 0 2px 10px rgba(0,0,0,0.08); }
  .match.is-final-of-bracket.highlight-loss { box-shadow: 0 0 0 3px rgba(234,0,42,0.50),  0 2px 10px rgba(0,0,0,0.08); }

  /* Auto-update */
  .update-overlay { position: fixed; inset: 0; background: rgba(10,20,40,0.72); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 24px; }
  .update-overlay.shown { display: flex; }
  .update-box { background: #fff; border-radius: var(--radius); padding: 32px; max-width: 380px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .update-spinner { width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 50%; border: 5px solid rgba(0,49,161,0.15); border-top-color: var(--spm-accent); animation: spin 0.85s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .update-title { font-size: 1.1rem; font-weight: 800; color: var(--spm-accent); margin-bottom: 6px; }

  /* ── PREPROD banner ──────────────────────────────────────────────
     Yellow strip pinned above the header so no human (and no agent
     reading a screenshot) can confuse the preprod URL with the live
     production URL. Removed by promote.sh when the preprod folder
     is collapsed back into the production root. */
  .preprod-banner {
    background: linear-gradient(90deg, #fde68a, #fcd34d);
    border-bottom: 1px solid #d97706;
    color: #78350f;
    font-weight: 700; font-size: 0.78rem;
    padding: 6px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex: 0 0 auto;
    z-index: 11;
  }
  .preprod-banner .pp-meta { font-size: 0.7rem; color: #92400e; font-weight: 600; }
  .preprod-banner a { color: #78350f; text-decoration: underline; }

  /* Terminal-match qualifier pill — reuses the existing .bracket-champ-big
     visual (gradient pill below the card with bounce animation) so the
     wiring engine's terminal matches look exactly like the production
     "Bracket Champ" pill on a final. The text is set per-card by
     wiringRenderBracket: "🏆 <bracketChampText>" by default. No corner-
     badge / inside-card treatment — pill sits OUTSIDE the box. */

  /* Qualifier header band — sits above a bracket's R1 column, reads
     "🏆 N World Qualifiers". Rendered above any bracket whose terminal
     count > 0 when WIRING_ENGINE is enabled. */
  .qualifier-band {
    background: linear-gradient(90deg, rgba(251,191,36,0.18), rgba(217,119,6,0.18));
    border: 1px solid #fbbf24;
    border-radius: 8px;
    color: #78350f;
    font-weight: 800;
    padding: 8px 14px;
    margin: 0 auto 10px;
    max-width: 480px;
    text-align: center;
  }
  .qualifier-band .qb-sub { font-size: 0.74rem; font-weight: 600; color: #92400e; }

  /* Red→blue vertical gradient stripe for 32-bracket cards. Rendered
     as a 3px-wide span on the left edge of each match card under
     WIRING_ENGINE when the card's bracket label is '32'. */
  .match.bracket-32 { border-left: 0 !important; }
  .match.bracket-32::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--spm-primary) 0%, var(--spm-accent) 100%);
    border-radius: 3px 0 0 3px;
  }
</style>
</head>
<body>

<div class="preprod-banner">
  <div>⚠️ <strong>PREPROD</strong> — staging build of BreakOut.
    Same data as production, alternate URL.
    <a href="../" target="_blank">production →</a></div>
  <div class="pp-meta">v<span id="preprodVersion">0.95</span>-preprod ·
    <span id="preprodEngine">WIRING engine</span> ·
    <a href="?engine=classic">fallback to classic</a></div>
</div>

<div class="update-overlay" id="updateOverlay">
  <div class="update-box">
    <div class="update-spinner"></div>
    <div class="update-title">Updating BreakOut</div>
    <div>A new version is being deployed&hellip;</div>
  </div>
</div>

<div class="staff-modal-overlay" id="staffModal" aria-hidden="true">
  <div class="staff-modal">
    <div class="staff-modal-head">
      <div class="mno" id="staffModalMno">M—</div>
      <div class="ctx" id="staffModalCtx"></div>
    </div>
    <div class="staff-modal-body">
      <div class="staff-overrides">
        <label>Start
          <div class="dt-pair">
            <input type="date" id="staffStartDate">
            <select id="staffStartTime"></select>
          </div>
        </label>
        <label>Table(s) <input type="text" id="staffTableInput" placeholder="1 or 5,6" pattern="^\s*\d+(\s*,\s*\d+)*\s*$"></label>
        <button type="button" class="staff-btn save" id="staffSaveOverridesBtn">Save</button>
      </div>
      <div class="q">Who won?</div>
      <button type="button" class="staff-team-btn" id="staffPickTop"></button>
      <button type="button" class="staff-team-btn" id="staffPickBot"></button>
    </div>
    <div class="staff-modal-actions">
      <button type="button" class="staff-btn clear" id="staffClearBtn">Clear result</button>
      <span class="spacer"></span>
      <button type="button" class="staff-btn" id="staffCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   BreakOut — tournament viewer
     Two 12-team brackets (modified SE w/ 4 byes each, top 4 seeds bye R1)
     feeding losers into a 64-slot consolation bracket that alternates
     "integrate 12-team losers" and "carry winners forward" rounds.
   ════════════════════════════════════════════════════════════════════════ */
const APP_NAME = 'BreakOut';
const SB_URL  = 'https://dqzbekoaysgaiqljueac.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxemJla29heXNnYWlxbGp1ZWFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNzA5NzgsImV4cCI6MjA5MDc0Njk3OH0.cCdGxZ4zEFzU_r6lWSDeoNWG67Q4MSYCAtpds035dfU';
const SCHEMA = 'breakout';
const HEADERS_APA = { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Accept-Profile': 'apa_core' };
const HEADERS_DB  = { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Accept-Profile': SCHEMA };

let _versionMismatch = false;
let _teams = [];        // sorted ASC by number
let _tournament = null;
let _tournamentRow = null;  // raw row from breakout.tournaments (incl id, matches JSONB)

/* URL params:
 *   ?t=<slug>        select a specific tournament (else most recently live)
 *   ?role=staff      enable click-to-record-winner UI
 *   ?key=<jwt>       service_role key used by staff for PATCH writes
 */
const URL_PARAMS = new URLSearchParams(location.search);
const URL_SLUG   = URL_PARAMS.get('t') || null;
const IS_STAFF   = URL_PARAMS.get('role') === 'staff';
const STAFF_KEY  = URL_PARAMS.get('key') || '';

/* ── PREPROD render engine selection ─────────────────────────────────
   Preprod exists to prove the wiring-driven engine works against every
   live tournament before promoting. So wiring is the DEFAULT here;
   ?engine=classic is the escape hatch that falls back to the production
   A/B/T64 hardcoded path. The banner reflects which engine is rendering
   so smoke-testers can tell at a glance. */
const WIRING_ENGINE = URL_PARAMS.get('engine') !== 'classic';
document.addEventListener('DOMContentLoaded', () => {
  const el = document.getElementById('preprodEngine');
  if (el) el.textContent = WIRING_ENGINE ? 'WIRING engine' : 'classic engine';
});
const HEADERS_STAFF = STAFF_KEY
  ? { apikey: STAFF_KEY, Authorization: 'Bearer ' + STAFF_KEY, 'Accept-Profile': 'breakout', 'Content-Profile': 'breakout', 'Content-Type': 'application/json' }
  : null;

/* Tournament-wide configurable text. Hydrated from
 * breakout.tournaments.config when an active tournament is loaded. */
const TOURNAMENT_TEXT = {
  bracketChampText: 'Bracket Champ',
  championText: 'Champion',
  bracketNameA: 'Bracket A',
  bracketNameB: 'Bracket B',
  bracketNameT64: '64-Team'
};

/* ── Auto-update ──────────────────────────── */
/* PREPROD guard: the apa_core.apps row tracks PRODUCTION's version (e.g.
   '0.94'), but this preprod build runs APP_VERSION='0.95-preprod'. A
   naive equality check would trigger the update overlay on every cold
   load and never resolve (pollForDeploy looks for '0.94' in version.js,
   which doesn't match). When we're served from /preprod/ we just
   short-circuit the whole version-watch — preprod versioning is driven
   by manual file edits + smoke test, not by the apa_core.apps row. */
const IS_PREPROD = location.pathname.indexOf('/preprod/') !== -1;
async function checkVersion() {
  if (IS_PREPROD) return;            // preprod doesn't track apa_core.apps
  if (_versionMismatch) return;
  try {
    const r = await fetch(SB_URL + '/rest/v1/apps?app_name=eq.' + APP_NAME + '&select=version', { headers: HEADERS_APA });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d[0] && d[0].version && d[0].version !== window.APP_VERSION) {
      _versionMismatch = true;
      document.getElementById('updateOverlay').classList.add('shown');
      pollForDeploy(d[0].version);
    }
  } catch (_) {}
}
function pollForDeploy(target) {
  setTimeout(async () => {
    try {
      const r = await fetch('version.js?_=' + Date.now());
      if (r.ok && (await r.text()).indexOf("APP_VERSION = '" + target + "'") !== -1) {
        const u = new URL(location.href);
        u.searchParams.set('_', String(Date.now()));
        location.replace(u.toString());
        return;
      }
    } catch (_) {}
    pollForDeploy(target);
  }, 3000);
}
checkVersion();
setInterval(checkVersion, 30000);

/* ── Live data refresh ───────────────────────
 *  Up-to-date data is a core principle: if the active tournament's
 *  `updated_at` changes while the page is loaded, re-fetch and re-render
 *  the bracket. Poll every 15s. Skip when the page is hidden or when an
 *  interactive control (modal, input) is in use, to avoid clobbering UX.
 *  Page-version updates (separate concern) are handled by checkVersion(). */
let _lastTournamentUpdatedAt = null;
async function pollTournamentUpdate() {
  if (document.hidden) return;
  if (document.querySelector('.modal.shown, .staff-modal-overlay.shown, input:focus, textarea:focus')) return;
  if (!_tournament) return;          // initial load hasn't finished
  try {
    const r = await fetch(SB_URL + '/rest/v1/' + tournamentQueryString('updated_at,id'), { headers: HEADERS_DB });
    if (!r.ok) return;
    const arr = await r.json();
    if (!arr || !arr[0]) return;
    const latest = arr[0].updated_at;
    if (_lastTournamentUpdatedAt && latest !== _lastTournamentUpdatedAt) {
      // Underlying tournament changed — pull fresh data and re-render.
      _tournament = await buildTournament();
      renderTournament();
    }
    _lastTournamentUpdatedAt = latest;
  } catch (_) {}
}
setInterval(pollTournamentUpdate, 15000);

/* ── Staff mode (click-to-record-winner) ────
 *  Active when URL has ?role=staff&key=<service_role>.
 *  Clicking any match opens a modal with two team buttons; click a team to
 *  record them as winner. Optimistic update + PATCH to breakout.tournaments.
 *  Re-renders bracket with downstream propagation. */
function setupStaffMode() {
  if (!IS_STAFF) return;
  document.body.classList.add('staff');
  // Inject the banner under the existing header.
  const banner = document.createElement('div');
  banner.className = 'staff-banner';
  banner.innerHTML = '<span class="dot"></span>STAFF MODE — click any match to record a winner';
  const header = document.querySelector('.header');
  if (header && header.parentNode) header.parentNode.insertBefore(banner, header.nextSibling);

  // Click delegation on matches. Ignore clicks on the dest chips (they
  // already navigate to other matches) and on bye cards.
  document.addEventListener('click', (e) => {
    if (!IS_STAFF) return;
    if (e.target.closest('a.dest-chip')) return;       // chip click → jump
    const cell = e.target.closest('.match');
    if (!cell) return;
    if (cell.classList.contains('bye')) return;        // byes have no result
    const matchId = cell.dataset.matchId;
    if (!matchId) return;
    openStaffModal(matchId);
  });

  document.getElementById('staffCancelBtn').addEventListener('click', closeStaffModal);
  document.getElementById('staffClearBtn').addEventListener('click', () => recordWinner(null));
  document.getElementById('staffPickTop').addEventListener('click', () => recordWinner('top'));
  document.getElementById('staffPickBot').addEventListener('click', () => recordWinner('bot'));
  document.getElementById('staffSaveOverridesBtn').addEventListener('click', saveStaffOverrides);
  document.getElementById('staffModal').addEventListener('click', (e) => {
    if (e.target.id === 'staffModal') closeStaffModal();    // click outside the box
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('staffModal').classList.contains('shown')) closeStaffModal();
  });
}

let _staffEditingMatchId = null;

function openStaffModal(matchId) {
  const m = _tournament && _tournament.all.find(x => x.id === matchId);
  if (!m) return;
  _staffEditingMatchId = matchId;
  const modal = document.getElementById('staffModal');
  document.getElementById('staffModalMno').textContent =
    m.globalNo ? 'M' + m.globalNo : '—';
  const ctx = [];
  if (m.bracket === '64') ctx.push('64-team');
  else ctx.push('Bracket ' + m.bracket);
  ctx.push('Round ' + m.round);
  if (m.day) ctx.push(m.day);
  if (m.time) ctx.push(m.time);
  if (m.table_no != null && m.table_no !== '') {
    const arr = String(m.table_no).split(',').map(s => s.trim()).filter(Boolean);
    ctx.push((arr.length > 1 ? 'Tables ' : 'Table ') + arr.join('+'));
  }
  document.getElementById('staffModalCtx').textContent = ctx.join(' · ');

  // Override fields: Start datetime + Table number.
  // If this match has no scheduled_at yet, fall back to any sibling in the
  // same round that does — so the picker opens at the round's assigned time
  // instead of blank, and the staff can fine-tune from there.
  let initialDt = m.scheduled_at;
  if (!initialDt) {
    const sibling = _tournament.all.find(x =>
      !x.bye && x.bracket === m.bracket && x.round === m.round && x.scheduled_at);
    if (sibling) initialDt = sibling.scheduled_at;
  }
  const dtParts = splitDateTime(initialDt || '');
  document.getElementById('staffStartDate').value = dtParts.date;
  document.getElementById('staffStartTime').innerHTML = buildTimeOptions(dtParts.time);
  document.getElementById('staffTableInput').value = m.table_no != null && m.table_no !== '' ? String(m.table_no) : '';
  const saveBtn = document.getElementById('staffSaveOverridesBtn');
  saveBtn.classList.remove('success');
  saveBtn.textContent = 'Save';

  renderStaffPick('staffPickTop', m, 'top');
  renderStaffPick('staffPickBot', m, 'bot');

  const clearBtn = document.getElementById('staffClearBtn');
  clearBtn.disabled = !m.winner_side;

  modal.classList.add('shown');
  modal.setAttribute('aria-hidden', 'false');
}

function renderStaffPick(btnId, m, side) {
  const btn = document.getElementById(btnId);
  const team = side === 'top' ? m.top : m.bottom;
  const isCurrentWinner = m.winner_side === side;
  btn.classList.toggle('is-winner', isCurrentWinner);
  if (!team) {
    btn.disabled = true;
    const source = side === 'top'
      ? (m.topFromMatch || m.topFromMatchLoser)
      : (m.botFromMatch || m.botFromMatchLoser);
    const waitOn = source && source.globalNo
      ? 'Waiting on M' + source.globalNo
      : 'Waiting on upstream match';
    btn.innerHTML = '<span class="seed">—</span>'
      + '<span class="team-num">—</span>'
      + '<span class="tbd">' + esc(waitOn) + '</span>'
      + '<span class="check">&#x2713;</span>';
    return;
  }
  btn.disabled = false;
  btn.innerHTML = '<span class="seed">' + esc(team.seed) + '</span>'
    + '<span class="team-num">' + pad4(team.number) + '</span>'
    + '<span class="name">' + esc(team.name) + '</span>'
    + '<span class="check">&#x2713;</span>';
}

function closeStaffModal() {
  const modal = document.getElementById('staffModal');
  modal.classList.remove('shown');
  modal.setAttribute('aria-hidden', 'true');
  _staffEditingMatchId = null;
}

function readStaffOverrides(md, idx) {
  const dateV = document.getElementById('staffStartDate').value;
  const timeV = document.getElementById('staffStartTime').value;
  const dtV   = combineDateTime(dateV, timeV);
  const tblV  = document.getElementById('staffTableInput').value.trim();
  const prev  = { scheduled_at: md[idx].scheduled_at || null, table_no: md[idx].table_no != null ? md[idx].table_no : null };
  md[idx].scheduled_at = dtV || null;
  // Accept either "5" or "5,6" so 2-table matches can be entered directly.
  if (tblV === '') {
    md[idx].table_no = null;
  } else {
    const arr = tblV.split(',').map(s => parseInt(s.trim(), 10)).filter(n => Number.isInteger(n) && n > 0);
    md[idx].table_no = arr.length === 0 ? null : (arr.length === 1 ? arr[0] : arr.join(','));
  }
  if (dtV) { md[idx].day = null; md[idx].time = null; }
  return prev;
}

async function recordWinner(side) {
  if (!_tournament || !_staffEditingMatchId) return;
  const md = _tournament.matchData;
  const idx = md.findIndex(x => x.id === _staffEditingMatchId);
  if (idx < 0) return;
  const m = _tournament.all.find(x => x.id === _staffEditingMatchId);
  if (side && (!m.top || !m.bottom)) {
    showToast('Both teams must be determined before recording a winner', 'err');
    return;
  }
  const prevSide = md[idx].winner_side || null;
  if (prevSide === side) {
    // No-op for winner; still flush any pending override edits.
    await saveStaffOverrides();
    return;
  }
  // Always confirm a winner change. Three flavors:
  //   1. First-time set: "Record X as the winner?"
  //   2. Override:       "Change the winner from X to Y?"
  //   3. Clear:          "Clear the winner (currently X)?"
  const mLabel = m.globalNo ? 'M' + m.globalNo : 'this match';
  let prompt;
  if (prevSide) {
    const prevTeam = prevSide === 'top' ? m.top : m.bottom;
    const prevName = prevTeam ? prevTeam.name : '(unknown)';
    if (side === null) {
      prompt = 'Clear the winner of ' + mLabel + '?\n\nCurrently recorded: ' + prevName + '.';
    } else {
      const newTeam = side === 'top' ? m.top : m.bottom;
      const newName = newTeam ? newTeam.name : '(unknown)';
      prompt = 'Change the winner of ' + mLabel + '?\n\nFrom: ' + prevName + '\nTo: ' + newName;
    }
  } else if (side) {
    const newTeam = side === 'top' ? m.top : m.bottom;
    const newName = newTeam ? newTeam.name : '(unknown)';
    prompt = 'Record ' + newName + ' as the winner of ' + mLabel + '?';
  }
  // Note: clearing a result that wasn't set is a no-op above; no prompt needed.
  if (prompt && !window.confirm(prompt)) return;
  const prevOverrides = readStaffOverrides(md, idx);
  md[idx].winner_side = side;

  reapplyTournamentInMemory();
  renderTournament();
  closeStaffModal();

  try {
    await saveTournamentMatches();
    showToast('Saved', 'ok');
  } catch (e) {
    md[idx].winner_side = prevSide;
    md[idx].scheduled_at = prevOverrides.scheduled_at;
    md[idx].table_no = prevOverrides.table_no;
    reapplyTournamentInMemory();
    renderTournament();
    showToast('Save failed: ' + e.message, 'err');
  }
}

async function saveStaffOverrides() {
  if (!_tournament || !_staffEditingMatchId) return;
  const md = _tournament.matchData;
  const idx = md.findIndex(x => x.id === _staffEditingMatchId);
  if (idx < 0) return;
  const prev = readStaffOverrides(md, idx);
  reapplyTournamentInMemory();
  renderTournament();
  const btn = document.getElementById('staffSaveOverridesBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    await saveTournamentMatches();
    btn.classList.add('success');
    btn.textContent = 'Saved ✓';
    setTimeout(() => {
      btn.classList.remove('success');
      btn.textContent = 'Save';
      btn.disabled = false;
    }, 1600);
  } catch (e) {
    md[idx].scheduled_at = prev.scheduled_at;
    md[idx].table_no = prev.table_no;
    reapplyTournamentInMemory();
    renderTournament();
    btn.disabled = false;
    btn.textContent = 'Save';
    showToast('Save failed: ' + e.message, 'err');
  }
}

function reapplyTournamentInMemory() {
  const teamsByNumber = Object.fromEntries(_teams.map(t => [t.number, t]));
  const seedAssignments = (_tournamentRow && Array.isArray(_tournamentRow.seed_assignments)
                          && _tournamentRow.seed_assignments.length)
    ? _tournamentRow.seed_assignments
    : defaultSeedAssignments(_teams);
  const fresh = reconstructTournament(_tournament.matchData, seedAssignments, teamsByNumber);
  fresh.matchData = _tournament.matchData;
  resolveTournament(fresh);
  _tournament = fresh;
}

async function saveTournamentMatches() {
  if (!_tournamentRow || !_tournamentRow.id) throw new Error('No active tournament loaded — generate one in admin first.');
  if (!HEADERS_STAFF) throw new Error('Staff key missing in URL (?key=…)');
  const r = await fetch(SB_URL + '/rest/v1/tournaments?id=eq.' + _tournamentRow.id,
    { method: 'PATCH', headers: HEADERS_STAFF, body: JSON.stringify({ matches: _tournament.matchData }) });
  if (!r.ok) {
    const txt = await r.text().catch(() => '');
    throw new Error('HTTP ' + r.status + (txt ? ': ' + txt.slice(0, 120) : ''));
  }
}

let _toastTimer = null;
function showToast(msg, kind) {
  const t = document.getElementById('saveToast');
  t.textContent = msg;
  t.classList.toggle('err', kind === 'err');
  t.classList.add('shown');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('shown'), kind === 'err' ? 4000 : 1800);
}

/* ── Util ─────────────────────────────────── */
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function pad4(n) { return String(n).padStart(4, '0'); }
function fmtTime(mins) {
  let h = Math.floor(mins / 60), m = mins % 60;
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ampm;
}
function fmtMoney(n) { return n == null ? '' : '$' + n.toLocaleString(); }
function splitDateTime(iso) {
  if (!iso || iso.length < 16) return { date: '', time: '' };
  return { date: iso.slice(0, 10), time: iso.slice(11, 16) };
}
function combineDateTime(date, time) {
  if (!date || !time) return '';
  return date + 'T' + time;
}
function buildTimeOptions(selected, startHour, endHour) {
  const sH = startHour != null ? startHour : 9;
  const eH = endHour   != null ? endHour   : 21;
  const inRange = [];
  let foundSelected = !selected;
  for (let totalMin = sH * 60; totalMin <= eH * 60; totalMin += 30) {
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    const val = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    let dh = h % 12; if (dh === 0) dh = 12;
    const display = dh + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM');
    if (val === selected) foundSelected = true;
    inRange.push('<option value="' + val + '"' + (val === selected ? ' selected' : '') + '>' + display + '</option>');
  }
  const result = ['<option value="">—</option>'];
  if (!foundSelected && selected) {
    const parts = selected.split(':');
    const h = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    let dh = h % 12; if (dh === 0) dh = 12;
    const display = dh + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM');
    result.push('<option value="' + selected + '" selected>' + display + ' (out of range)</option>');
  }
  result.push(...inRange);
  return result.join('');
}

/* ── Data fetch ───────────────────────────── */
async function loadTeams() {
  const r = await fetch(SB_URL + '/rest/v1/teams?order=number.asc&select=id,number,name', { headers: HEADERS_DB });
  if (!r.ok) throw new Error('Could not load teams: HTTP ' + r.status);
  _teams = await r.json();
}

/* ════════════════════════════════════════════════════════════════════════
   TOURNAMENT BUILD
   ════════════════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════════════════════════════
   TEMPLATE — produces a flat array of match-data objects describing the
   wiring of the 12+12→64 modified-SE tournament. Each match references
   either seed indices (R1 entrants) OR another match by id + 'winner'/'loser'
   kind. This is the shape we'll eventually store in breakout.tournaments.matches.
   ════════════════════════════════════════════════════════════════════════ */

/* Bracket order for a 16-team SE bracket: positions 0..15 ↦ seeds.
 *  Used to place 12 real teams + 4 ghost byes so the structural bracket
 *  is regular while the top 4 seeds get R1 byes. */
const SEED_ORDER_16 = [1, 16, 8, 9, 4, 13, 5, 12, 2, 15, 7, 10, 3, 14, 6, 11];

/* 32-team NCAA-style seeding for Mod-SE 32→8 template. Mirror of admin. */
const SEED_ORDER_32 = [
  1, 32, 16, 17,   8, 25,  9, 24,
  4, 29, 13, 20,   5, 28, 12, 21,
  2, 31, 15, 18,   7, 26, 10, 23,
  3, 30, 14, 19,   6, 27, 11, 22
];

const TEMPLATE_SCHEDULES = {
  twelve: [
    { day: 'Saturday', time: '9:00 AM',  payout: null },
    { day: 'Saturday', time: '10:30 AM', payout: null },
    { day: 'Saturday', time: '12:00 PM', payout: 100 },
    { day: 'Saturday', time: '1:30 PM',  payout: 400 }
  ],
  sixtyfour: [
    { day: 'Saturday', time: '11:00 AM', payout: null },
    { day: 'Saturday', time: '1:00 PM',  payout: null },
    { day: 'Saturday', time: '3:00 PM',  payout: null },
    { day: 'Saturday', time: '5:00 PM',  payout: null },
    { day: 'Sunday',   time: '10:00 AM', payout: 100 },
    { day: 'Sunday',   time: '12:00 PM', payout: 600 }
  ]
};

/* ══════════════════════════════════════════════════════════════════════
   Template: Mod-SE 32→8 (viewer mirror of the admin generator).
   Mirrors the APA Mod-SE 32-1 reference PDF truncated at the 8-team
   advancement line. See admin.html for full per-round documentation.
   ══════════════════════════════════════════════════════════════════════ */
const MSE32_SCHEDULE = {
  1: { day: 'Saturday', time: '9:00 AM',  payout: null },
  2: { day: 'Saturday', time: '11:00 AM', payout: null },
  3: { day: 'Saturday', time: '1:00 PM',  payout: null },
  4: { day: 'Saturday', time: '3:00 PM',  payout: null }
};

function templateMse32To8() {
  const md = [];
  const b = '32';
  const id = (r, s) => '32-r' + r + 's' + s;
  for (let i = 0; i < 16; i++) {
    md.push({ id: id(1, i), bracket: b, round: 1, slot: i, is_bye: false,
      top_seed: SEED_ORDER_32[i * 2], bot_seed: SEED_ORDER_32[i * 2 + 1] });
  }
  for (let i = 0; i < 8; i++) {
    md.push({ id: id(2, i), bracket: b, round: 2, slot: i, is_bye: false,
      top_from: { match_id: id(1, i * 2),     kind: 'winner' },
      bot_from: { match_id: id(1, i * 2 + 1), kind: 'winner' } });
  }
  for (let i = 0; i < 8; i++) {
    md.push({ id: id(2, i + 8), bracket: b, round: 2, slot: i + 8, is_bye: false,
      top_from: { match_id: id(1, i * 2),     kind: 'loser' },
      bot_from: { match_id: id(1, i * 2 + 1), kind: 'loser' } });
  }
  for (let i = 0; i < 8; i++) {
    md.push({ id: id(3, i), bracket: b, round: 3, slot: i, is_bye: false,
      top_from: { match_id: id(2, i + 8), kind: 'winner' },
      bot_from: { match_id: id(2, 7 - i), kind: 'loser'  } });
  }
  for (let i = 0; i < 4; i++) {
    md.push({ id: id(4, i), bracket: b, round: 4, slot: i, is_bye: false,
      top_from: { match_id: id(3, i * 2),     kind: 'winner' },
      bot_from: { match_id: id(3, i * 2 + 1), kind: 'winner' },
      is_qualifier: true });
  }
  for (let i = 0; i < 4; i++) {
    md.push({ id: id(3, i + 8), bracket: b, round: 3, slot: i + 8, is_bye: false,
      top_from: { match_id: id(2, i * 2),     kind: 'winner' },
      bot_from: { match_id: id(2, i * 2 + 1), kind: 'winner' },
      is_qualifier: true });
  }
  for (const m of md) {
    const s = MSE32_SCHEDULE[m.round];
    if (s) { m.day = s.day; m.time = s.time; m.payout = s.payout; }
  }
  // M numbering (match the PDF) — same segments as admin.
  const segments = [
    { round: 1, smin: 0, smax: 15, start: 1  },
    { round: 2, smin: 0, smax: 7,  start: 17 },
    { round: 2, smin: 8, smax: 15, start: 25 },
    { round: 3, smin: 0, smax: 7,  start: 33 },
    { round: 4, smin: 0, smax: 3,  start: 41 },
    { round: 3, smin: 8, smax: 11, start: 45 }
  ];
  for (const seg of segments) {
    md.filter(m => m.round === seg.round && m.slot >= seg.smin && m.slot <= seg.smax)
      .sort((a, b) => a.slot - b.slot)
      .forEach((m, i) => { m.match_no = seg.start + i; });
  }
  let p = 1;
  for (let r = 1; r <= 4; r++) {
    md.filter(m => m.round === r).sort((a, b) => a.slot - b.slot)
      .forEach(m => { m.play_order = p++; });
  }
  for (let r = 1; r <= 4; r++) {
    md.filter(m => m.round === r).sort((a, b) => a.slot - b.slot)
      .forEach((m, idx) => { m.table_no = idx + 1; });
  }
  return md;
}

function templateModSe12_12To64() {
  const md = [];
  md.push(...gen12Bracket('A'));
  md.push(...gen12Bracket('B'));
  md.push(...gen64Bracket());
  applyTemplateSchedule(md);
  assignMatchNumbers(md);
  assignTableNumbers(md);
  return md;
}

function gen12Bracket(label) {
  const matches = [];
  for (let i = 0; i < 8; i++) {
    const topSeed = SEED_ORDER_16[i * 2];
    const botSeed = SEED_ORDER_16[i * 2 + 1];
    const topReal = topSeed <= 12 ? topSeed : null;
    const botReal = botSeed <= 12 ? botSeed : null;
    if (topReal && botReal) {
      matches.push({ id: label + '-R1-M' + i, bracket: label, round: 1, slot: i, is_bye: false,
                     top_seed: topReal, bot_seed: botReal });
    } else {
      const seededTeam = topReal || botReal;
      matches.push({ id: label + '-R1-BYE' + i, bracket: label, round: 1, slot: i, is_bye: true,
                     top_seed: seededTeam, bot_seed: null });
    }
  }
  for (let i = 0; i < 4; i++) {
    matches.push({ id: label + '-R2-M' + (i + 1), bracket: label, round: 2, slot: i, is_bye: false,
                   top_from: { match_id: matches[i * 2].id, kind: 'winner' },
                   bot_from: { match_id: matches[i * 2 + 1].id, kind: 'winner' } });
  }
  const r2 = matches.filter(m => m.round === 2);
  for (let i = 0; i < 2; i++) {
    matches.push({ id: label + '-R3-M' + (i + 1), bracket: label, round: 3, slot: i, is_bye: false,
                   top_from: { match_id: r2[i * 2].id, kind: 'winner' },
                   bot_from: { match_id: r2[i * 2 + 1].id, kind: 'winner' } });
  }
  const r3 = matches.filter(m => m.round === 3);
  matches.push({ id: label + '-R4-M1', bracket: label, round: 4, slot: 0, is_bye: false,
                 top_from: { match_id: r3[0].id, kind: 'winner' },
                 bot_from: { match_id: r3[1].id, kind: 'winner' } });
  return matches;
}

function gen64Bracket() {
  const matches = [];
  const aR1Real = [1, 3, 5, 7].map(i => 'A-R1-M' + i);
  const aR2     = [1, 2, 3, 4].map(i => 'A-R2-M' + i);
  const bR1Real = [1, 3, 5, 7].map(i => 'B-R1-M' + i);
  const bR2     = [1, 2, 3, 4].map(i => 'B-R2-M' + i);
  for (let i = 0; i < 4; i++) {
    matches.push({ id: '64-R1-M' + (i + 1), bracket: '64', round: 1, slot: i, is_bye: false,
                   top_from: { match_id: aR1Real[i], kind: 'loser' },
                   bot_from: { match_id: aR2[i], kind: 'loser' } });
  }
  for (let i = 0; i < 4; i++) {
    matches.push({ id: '64-R1-M' + (i + 5), bracket: '64', round: 1, slot: i + 4, is_bye: false,
                   top_from: { match_id: bR1Real[i], kind: 'loser' },
                   bot_from: { match_id: bR2[i], kind: 'loser' } });
  }
  for (let i = 0; i < 4; i++) {
    matches.push({ id: '64-R2-M' + (i + 1), bracket: '64', round: 2, slot: i, is_bye: false,
                   top_from: { match_id: '64-R1-M' + (i * 2 + 1), kind: 'winner' },
                   bot_from: { match_id: '64-R1-M' + (i * 2 + 2), kind: 'winner' } });
  }
  const integ = [
    ['64-R3-M1', 'A-R3-M1', '64-R2-M1'],
    ['64-R3-M2', 'A-R3-M2', '64-R2-M2'],
    ['64-R3-M3', 'B-R3-M1', '64-R2-M3'],
    ['64-R3-M4', 'B-R3-M2', '64-R2-M4']
  ];
  integ.forEach((row, idx) => {
    const [id, loserSrc, winnerSrc] = row;
    matches.push({ id: id, bracket: '64', round: 3, slot: idx, is_bye: false,
                   top_from: { match_id: loserSrc, kind: 'loser' },
                   bot_from: { match_id: winnerSrc, kind: 'winner' } });
  });
  for (let i = 0; i < 2; i++) {
    matches.push({ id: '64-R4-M' + (i + 1), bracket: '64', round: 4, slot: i, is_bye: false,
                   top_from: { match_id: '64-R3-M' + (i * 2 + 1), kind: 'winner' },
                   bot_from: { match_id: '64-R3-M' + (i * 2 + 2), kind: 'winner' } });
  }
  matches.push({ id: '64-R5-M1', bracket: '64', round: 5, slot: 0, is_bye: false,
                 top_from: { match_id: 'A-R4-M1', kind: 'loser' },
                 bot_from: { match_id: '64-R4-M1', kind: 'winner' } });
  matches.push({ id: '64-R5-M2', bracket: '64', round: 5, slot: 1, is_bye: false,
                 top_from: { match_id: 'B-R4-M1', kind: 'loser' },
                 bot_from: { match_id: '64-R4-M2', kind: 'winner' } });
  matches.push({ id: '64-R6-M1', bracket: '64', round: 6, slot: 0, is_bye: false,
                 top_from: { match_id: '64-R5-M1', kind: 'winner' },
                 bot_from: { match_id: '64-R5-M2', kind: 'winner' } });
  return matches;
}

function applyTemplateSchedule(matchData) {
  for (const m of matchData) {
    const sched = (m.bracket === '64' ? TEMPLATE_SCHEDULES.sixtyfour : TEMPLATE_SCHEDULES.twelve)[m.round - 1];
    if (sched) { m.day = sched.day; m.time = sched.time; m.payout = sched.payout; }
  }
}

function assignMatchNumbers(matchData) {
  // M# = bracket-position number: bracket A → B → 64, then round, then slot.
  // Every match (real + bye) gets one. Stable IDs for cross-references.
  // For BreakOut today: M1..M15 = A, M16..M30 = B, M31..M51 = 64.
  const bracketOrder = ['A', 'B', '64'];
  let no = 1;
  for (const bracket of bracketOrder) {
    const inBracket = matchData.filter(m => m.bracket === bracket);
    if (!inBracket.length) continue;
    const maxRound = Math.max.apply(null, inBracket.map(m => m.round));
    for (let r = 1; r <= maxRound; r++) {
      inBracket.filter(m => m.round === r)
               .sort((a, b) => a.slot - b.slot)
               .forEach(m => { m.match_no = no++; });
    }
  }
  // play_order = scheduling sequence (which match is played first, etc).
  // Byes have no play_order. Used by schedules/timetables, not by the
  // bracket renderer's display.
  const playSeq = [
    ['A', 1], ['B', 1], ['A', 2], ['B', 2], ['64', 1],
    ['A', 3], ['B', 3], ['64', 2], ['64', 3],
    ['A', 4], ['B', 4], ['64', 4], ['64', 5], ['64', 6]
  ];
  let p = 1;
  for (const pair of playSeq) {
    matchData.filter(m => m.bracket === pair[0] && m.round === pair[1] && !m.is_bye)
             .sort((a, b) => a.slot - b.slot)
             .forEach(m => { m.play_order = p++; });
  }
}

function assignTableNumbers(matchData) {
  for (const bracket of ['A', 'B', '64']) {
    for (let r = 1; r <= 6; r++) {
      const ms = matchData.filter(m => m.bracket === bracket && m.round === r && !m.is_bye)
                          .sort((a, b) => a.slot - b.slot);
      ms.forEach((m, idx) => { m.table_no = idx + 1; });
    }
  }
}

function defaultSeedAssignments(teams) {
  const sa = [];
  teams.slice(0, 12).forEach((t, i)  => sa.push({ bracket: 'A', seed: i + 1, team_number: t.number }));
  teams.slice(12, 24).forEach((t, i) => sa.push({ bracket: 'B', seed: i + 1, team_number: t.number }));
  return sa;
}

/* ════════════════════════════════════════════════════════════════════════
   RECONSTRUCT — build the in-memory tournament graph from template data
   + seed assignments + teams catalog. Output shape matches what the old
   inline build*() functions produced, so the renderer is unchanged.
   ════════════════════════════════════════════════════════════════════════ */
function reconstructTournament(matchData, seedAssignments, teamsByNumber) {
  const teamByBracketSeed = {};
  for (const sa of seedAssignments) {
    const t = teamsByNumber[sa.team_number];
    if (t) teamByBracketSeed[sa.bracket + '.' + sa.seed] = Object.assign({}, t, { seed: sa.seed });
  }
  const resolveTeam = (bracket, seed) => seed == null ? null : (teamByBracketSeed[bracket + '.' + seed] || null);
  const matchById = {};
  const allMatches = [];
  for (const md of matchData) {
    const m = {
      id: md.id, bracket: md.bracket, round: md.round, slot: md.slot,
      bye: !!md.is_bye,
      top: resolveTeam(md.bracket, md.top_seed),
      bottom: resolveTeam(md.bracket, md.bot_seed),
      topFromMatch: null, botFromMatch: null,
      topFromMatchLoser: null, botFromMatchLoser: null,
      winner: null, loser: null, topWins: null,
      // Staff-recorded result lives in winner_side ('top' | 'bot' | null).
      // Resolved into winner/loser/topWins by resolveTournament().
      winner_side: md.winner_side || null,
      globalNo: md.match_no || null,
      scheduled_at: md.scheduled_at || null,
      day: md.day, time: md.time, payout: md.payout, table_no: md.table_no,
      tables_in_parallel: md.tables_in_parallel || 1,
      // Carry raw wiring references forward so the wiring engine can run
      // straight off `t.all` (no double-bookkeeping with matchData).
      top_from: md.top_from || null,
      bot_from: md.bot_from || null,
      top_seed: md.top_seed != null ? md.top_seed : null,
      bot_seed: md.bot_seed != null ? md.bot_seed : null,
      is_qualifier: !!md.is_qualifier,
      match_no: md.match_no || null
    };
    if (m.bye && m.top) { m.winner = m.top; m.topWins = true; }
    matchById[m.id] = m;
    allMatches.push(m);
  }
  for (const md of matchData) {
    const m = matchById[md.id];
    if (md.top_from) {
      const ref = matchById[md.top_from.match_id];
      if (md.top_from.kind === 'winner') m.topFromMatch = ref;
      else if (md.top_from.kind === 'loser') m.topFromMatchLoser = ref;
    }
    if (md.bot_from) {
      const ref = matchById[md.bot_from.match_id];
      if (md.bot_from.kind === 'winner') m.botFromMatch = ref;
      else if (md.bot_from.kind === 'loser') m.botFromMatchLoser = ref;
    }
  }
  return {
    A:   { label: 'A',  matches: allMatches.filter(m => m.bracket === 'A')  },
    B:   { label: 'B',  matches: allMatches.filter(m => m.bracket === 'B')  },
    T64: { label: '64', matches: allMatches.filter(m => m.bracket === '64') },
    all: allMatches
  };
}

function resolveTournament(t) {
  // Walk matches in play order. For each match:
  //   1) Resolve top/bottom from upstream feeders if not already set.
  //   2) If staff recorded a winner (winner_side), apply it.
  //   3) Otherwise the match stays TBD until staff records a winner.
  const ordered = t.all.filter(m => !m.bye && m.globalNo != null)
                        .slice().sort((a, b) => a.globalNo - b.globalNo);
  for (const m of ordered) {
    if (m.top == null) {
      if (m.topFromMatch) m.top = m.topFromMatch.winner;
      else if (m.topFromMatchLoser) m.top = m.topFromMatchLoser.loser;
    }
    if (m.bottom == null) {
      if (m.botFromMatch) m.bottom = m.botFromMatch.winner;
      else if (m.botFromMatchLoser) m.bottom = m.botFromMatchLoser.loser;
    }
    if (m.winner_side === 'top' && m.top) {
