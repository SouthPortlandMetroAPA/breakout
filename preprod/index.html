      m.winner = m.top; m.loser = m.bottom; m.topWins = true;
    } else if (m.winner_side === 'bot' && m.bottom) {
      m.winner = m.bottom; m.loser = m.top; m.topWins = false;
    }
  }
  for (const m of t.all) {
    if (m.topFromMatchLoser) m.topFromMatchLoser.loserDropTo = m;
    if (m.botFromMatchLoser) m.botFromMatchLoser.loserDropTo = m;
    if (m.topFromMatch) m.topFromMatch.winnerAdvancesTo = m;
    if (m.botFromMatch) m.botFromMatch.winnerAdvancesTo = m;
  }
}

/* ════════════════════════════════════════════════════════════════════════
   TOURNAMENT LOAD — prefer the active row in breakout.tournaments. Falls
   back to inline template generation when no row exists yet so the bracket
   structure stays visible (all matches show TBD until results are recorded).
   ════════════════════════════════════════════════════════════════════════ */
/* Slug-aware tournament lookup. If ?t=<slug> is present, pull that
 * specific tournament regardless of its status. Otherwise pick the most
 * recently created live tournament. */
function tournamentQueryString(selectClause) {
  const sel = selectClause || '*';
  if (URL_SLUG) {
    return 'tournaments?slug=eq.' + encodeURIComponent(URL_SLUG) + '&select=' + sel + '&limit=1';
  }
  return 'tournaments?status=eq.live&order=created_at.desc&limit=1&select=' + sel;
}

async function loadActiveTournament() {
  try {
    const r = await fetch(SB_URL + '/rest/v1/' + tournamentQueryString('*'), { headers: HEADERS_DB });
    if (!r.ok) return null;
    const arr = await r.json();
    const row = arr && arr[0] ? arr[0] : null;
    if (row && row.updated_at) _lastTournamentUpdatedAt = row.updated_at;
    return row;
  } catch (e) { return null; }
}

async function buildTournament() {
  // No team-count gate. The bracket structure comes from the template
  // (or the DB row); teams are seeded into it where they exist. With
  // 0 teams every slot resolves to TBD; with a partial roster the
  // unfilled seeds show TBD. The bracket always renders.
  const dbRow = await loadActiveTournament();
  let matchData, seedAssignments, config;
  if (dbRow && Array.isArray(dbRow.matches) && dbRow.matches.length) {
    matchData = dbRow.matches;
    seedAssignments = Array.isArray(dbRow.seed_assignments) && dbRow.seed_assignments.length
                       ? dbRow.seed_assignments
                       : defaultSeedAssignments(_teams);
    config = dbRow.config || {};
    _tournamentRow = dbRow;
  } else {
    matchData = templateModSe12_12To64();
    seedAssignments = defaultSeedAssignments(_teams);
    config = {};
    _tournamentRow = null;
  }
  if (config.bracketChampText) TOURNAMENT_TEXT.bracketChampText = config.bracketChampText;
  if (config.championText)     TOURNAMENT_TEXT.championText     = config.championText;
  // Per-bracket display name override. Keys: A, B, T64. Falls back to the
  // hardcoded defaults if a key is absent or blank.
  const bn = config.bracketNames || {};
  TOURNAMENT_TEXT.bracketNameA   = (bn.A   || '').trim() || 'Bracket A';
  TOURNAMENT_TEXT.bracketNameB   = (bn.B   || '').trim() || 'Bracket B';
  TOURNAMENT_TEXT.bracketNameT64 = (bn.T64 || '').trim() || '64-Team';
  const teamsByNumber = Object.fromEntries(_teams.map(t => [t.number, t]));
  const tData = reconstructTournament(matchData, seedAssignments, teamsByNumber);
  tData.matchData = matchData;            // raw template/DB data — staff writes mutate this
  resolveTournament(tData);
  return tData;
}

/* ════════════════════════════════════════════════════════════════════════
   RENDER — SVG-based
   Every bracket is one inline <svg> with a fixed viewBox in design units.
   The viewBox is the secret to print-fit: the browser scales it to whatever
   container size we give the svg, so @media print needs no zoom tricks.

   Design units inside the viewBox:
     • Card:   240w × 136h
     • Slot:   152 vertical units, 8 slots per bracket
     • Round:  card-w + 110 gap between columns
     • Cards as <foreignObject> so HTML/CSS still drives card visuals.
     • Connectors / cross-source labels / round headers / dividers as
       native SVG, sharing the card coordinate system.
   ════════════════════════════════════════════════════════════════════════ */

/* Design constants — single source of truth for every render-side number.
 * If the on-screen rendering ever needs to change card dimensions, update
 * these and everything (positioning, connectors, viewBox) follows. */
const SVG = {
  CARD_W: 240,
  CARD_H: 136,
  ROUND_GAP: 110,
  SLOT_H: 152,
  SLOTS: 8,
  HEADER_H: 44,           // round-header band (tall enough to fit round name + "N TABLES" pill + underline without collision)
  HEADER_TEXT_Y: 18,      // baseline for round-name text (y = TOP_PAD + 18 = 30)
  HEADER_PILL_Y: 30,      // baseline for "N tables" pill text (rect spans y = 33..46)
  LEFT_PAD: 110,          // left gutter — gives cross-source labels room
  RIGHT_PAD: 8,
  TOP_PAD: 12,            // small gap above header band
  CHAMP_BAND_H: 60,       // vertical room below cards for the champ pill
  BRACKET_COLORS: {
    A:  '#ea002a',
    B:  '#0031a1',
    '64': '#6b7280'
  }
};

function bracketLayout(rounds) {
  const NR = rounds.length;
  const w = SVG.LEFT_PAD + NR * SVG.CARD_W + (NR - 1) * SVG.ROUND_GAP + SVG.RIGHT_PAD;
  const h = SVG.TOP_PAD + SVG.HEADER_H + SVG.SLOTS * SVG.SLOT_H + SVG.CHAMP_BAND_H;
  return { w, h, rounds: NR };
}

function roundXLeft(roundIdx) {
  return SVG.LEFT_PAD + roundIdx * (SVG.CARD_W + SVG.ROUND_GAP);
}
function roundXCenter(roundIdx) {
  return roundXLeft(roundIdx) + SVG.CARD_W / 2;
}
function matchYCenter(m) {
  return SVG.TOP_PAD + SVG.HEADER_H + matchYUnits(m) * SVG.SLOT_H;
}
function matchTopY(m) {
  return matchYCenter(m) - SVG.CARD_H / 2;
}

function bracketSectionHtml(bracket, kind, rounds, opts) {
  const sectionLabel = opts.label;
  const pillClass = opts.pillClass;
  const layout = bracketLayout(rounds);
  const stripeColor = SVG.BRACKET_COLORS[bracket.label] || '#94a3b8';

  // 1) Background scaffolding: round headers + dividers
  let svgInner = '';

  // Round headers + per-round underline + round divider lines
  for (let i = 0; i < rounds.length; i++) {
    const cx = roundXCenter(i);
    const xL = roundXLeft(i);
    const xR = xL + SVG.CARD_W;
    const real = rounds[i].filter(m => !m.bye);
    const tip = real[0] && real[0].tables_in_parallel ? real[0].tables_in_parallel : 1;
    svgInner += '<text class="round-name" x="' + cx + '" y="' + (SVG.TOP_PAD + SVG.HEADER_TEXT_Y)
      + '" text-anchor="middle" dominant-baseline="alphabetic">Round ' + (i + 1) + '</text>';
    if (tip > 1) {
      const text = tip + ' TABLES';
      const tw = text.length * 6 + 14;
      svgInner += '<rect class="round-tables-bg" x="' + (cx - tw / 2) + '" y="' + (SVG.TOP_PAD + SVG.HEADER_PILL_Y - 9)
        + '" width="' + tw + '" height="13" rx="6.5"/>'
        + '<text class="round-tables" x="' + cx + '" y="' + (SVG.TOP_PAD + SVG.HEADER_PILL_Y)
        + '" text-anchor="middle" dominant-baseline="alphabetic">' + esc(text) + '</text>';
    }
    // Header underline beneath each round's title
    svgInner += '<line class="round-header-underline" x1="' + xL + '" y1="' + (SVG.TOP_PAD + SVG.HEADER_H - 6)
      + '" x2="' + xR + '" y2="' + (SVG.TOP_PAD + SVG.HEADER_H - 6) + '"/>';
    // Dashed divider in the gap to the next round
    if (i > 0) {
      const dividerX = xL - SVG.ROUND_GAP / 2;
      const topY = SVG.TOP_PAD + SVG.HEADER_H;
      const botY = SVG.TOP_PAD + SVG.HEADER_H + SVG.SLOTS * SVG.SLOT_H;
      svgInner += '<line class="round-divider" x1="' + dividerX + '" y1="' + topY
        + '" x2="' + dividerX + '" y2="' + botY + '"/>';
    }
  }

  // 2) Connectors layer placeholder — we'll inject paths after first render
  //    so each path can attach correct attributes.
  svgInner += '<g class="connectors-layer"></g>';
  svgInner += '<g class="cross-source-layer"></g>';

  // 3) Card foreignObjects + bracket-champ foreignObjects per match
  for (let i = 0; i < rounds.length; i++) {
    const isFinal = i === rounds.length - 1;
    const xL = roundXLeft(i);
    for (const m of rounds[i]) {
      const y = matchTopY(m);
      const cardHtml = m.bye ? byeMatchHtml(m, stripeColor) : matchHtml(m, isFinal, stripeColor);
      svgInner += '<foreignObject class="card-fo" data-match-fo="' + esc(m.id)
        + '" x="' + xL + '" y="' + y
        + '" width="' + SVG.CARD_W + '" height="' + SVG.CARD_H + '">'
        + '<div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%">'
        + cardHtml
        + '</div></foreignObject>';
      if (isFinal && !m.bye) {
        const yCenter = matchYCenter(m);
        const champCx = roundXCenter(i);
        // Foreign-object enclosure for the champ pill. Sized with vertical
        // headroom so the bounce + scale-up animation (translateY -4px +
        // scale 1.05) AND the box-shadow halo around the pill don't clip
        // against the FO bounds. The pill stays vertically centered inside
        // the FO via flex, so we move the FO up by half the extra padding
        // to keep the pill's visual position the same.
        const PILL_W = 260;
        const PILL_VISIBLE_H = 50;  // unanimated pill height (legacy reference)
        const PILL_PAD = 20;        // extra room on each side for animation + shadow
        const PILL_H = PILL_VISIBLE_H + PILL_PAD * 2;
        const champY = (yCenter + SVG.CARD_H / 2 + 6) - PILL_PAD;
        svgInner += '<foreignObject class="champ-fo" data-match-fo="' + esc(m.id) + '-champ"'
          + ' x="' + (champCx - PILL_W / 2) + '" y="' + champY
          + '" width="' + PILL_W + '" height="' + PILL_H
          + '"><div xmlns="http://www.w3.org/1999/xhtml" '
          + 'style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:visible">'
          + '<div class="bracket-champ-big">&#x1F3C6; ' + esc(TOURNAMENT_TEXT.bracketChampText) + '</div>'
          + '</div></foreignObject>';
      }
    }
  }

  // Outer svg + container
  const svg = '<svg class="bracket-svg" xmlns="http://www.w3.org/2000/svg" '
    + 'data-wrap="' + bracket.label + '" '
    + 'viewBox="0 0 ' + layout.w + ' ' + layout.h + '" '
    + 'preserveAspectRatio="xMinYMin meet" '
    + 'style="width:' + layout.w + 'px;height:' + layout.h + 'px">'
    + svgInner + '</svg>';

  return '<div class="bracket-section" data-bracket="' + bracket.label + '" data-design-w="' + layout.w + '" data-design-h="' + layout.h + '">'
    + '<div class="section-title"><span class="pill ' + pillClass + '">' + esc(sectionLabel) + '</span></div>'
    + '<div class="viewport"><div class="bracket-wrap" data-wrap="' + bracket.label + '">'
    +   svg
    + '</div></div>'
    + '</div>';
}

/* Canonical bracket Y for a match, in slot units.
 *   12-team modified SE has 4 lanes (slots 0..3).
 *   64-team has 8 lanes (slots 0..7).
 *
 *   Same rule as before: one intra-bracket feeder → align with feeder.
 *   Two intra-bracket feeders → midpoint of the two. Single --slot-h is
 *   shared across brackets, so cards are evenly spaced everywhere. */
function matchYUnits(m) {
  if (m.bracket === '64') {
    if (m.round === 1) return m.slot + 0.5;     // 0.5, 1.5, …, 7.5
    if (m.round === 2) return m.slot * 2 + 1;   // midpoint of R1 pair: 1, 3, 5, 7
    if (m.round === 3) return m.slot * 2 + 1;   // aligned with R2 feeder
    if (m.round === 4) return m.slot * 4 + 2;   // midpoint of R3 pair: 2, 6
    if (m.round === 5) return m.slot * 4 + 2;   // aligned with R4 feeder
    if (m.round === 6) return 4;                // midpoint of R5 pair
  } else {
    // 12-team modified SE rendered as full 16-slot bracket (4 byes shown).
    if (m.round === 1) return m.slot + 0.5;     // 0.5, 1.5, …, 7.5 (slot = seat-pair index)
    if (m.round === 2) return m.slot * 2 + 1;   // midpoint of R1 pair: 1, 3, 5, 7
    if (m.round === 3) return m.slot * 4 + 2;   // midpoint of R2 pair: 2, 6
    if (m.round === 4) return 4;                // midpoint of R3 pair
  }
  return 0.5;
}
function bracketSlotsFor(_bracket) {
  // 12-team-as-16 and 64-team both use 8 lanes in R1 → 8 slots per bracket.
  return 8;
}

function matchHtml(m, isFinalOfBracket, stripeColor) {
  if (m.bye) return byeMatchHtml(m, stripeColor);
  const tnum = m.globalNo ? 'M' + m.globalNo : '—';
  const topWin = m.topWins === true;
  const botWin = m.topWins === false;
  // table_no may be a number, "5", or "5,6" (2-table matches). Render
  // as "Tables 5+6" when multi-, "Table 5" when single.
  let tableLabel = '';
  if (m.table_no != null && m.table_no !== '') {
    const tArr = String(m.table_no).split(',').map(s => s.trim()).filter(Boolean);
    tableLabel = (tArr.length > 1 ? 'Tables ' : 'Table ') + tArr.join('+');
  }
  // Prefer the canonical scheduled_at (ISO datetime from the picker). Fall
  // back to legacy m.day / m.time strings so older rows still display.
  let scheduleDay  = '';
  let scheduleTime = '';
  if (m.scheduled_at) {
    const d = new Date(m.scheduled_at);
    if (!isNaN(d.getTime())) {
      scheduleDay  = d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
      scheduleTime = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }
  } else {
    scheduleDay  = m.day  ? m.day.slice(0, 3).toUpperCase() : '';
    scheduleTime = m.time || '';
  }
  const schedulePay  = m.payout ? fmtMoney(m.payout) : '';

  // Destination chips — pills in the top-right that link to the linked match.
  // For bracket finals the Bracket Champ pill is rendered OUTSIDE the card
  // (see roundHtml) so it can be big and prominent. No in-card chip for finals.
  let winnerChip = '';
  if (m.winnerAdvancesTo) {
    winnerChip = '<a class="dest-chip win" data-jump="' + m.winnerAdvancesTo.globalNo
      + '" href="#m' + m.winnerAdvancesTo.globalNo
      + '" title="Jump to M' + m.winnerAdvancesTo.globalNo + '">W &rarr; M'
      + m.winnerAdvancesTo.globalNo + '</a>';
  }

  let loserChip = '';
  if (m.loserDropTo) {
    loserChip = '<a class="dest-chip lose" data-jump="' + m.loserDropTo.globalNo
      + '" href="#m' + m.loserDropTo.globalNo
      + '" title="Jump to M' + m.loserDropTo.globalNo + '">L &rarr; M'
      + m.loserDropTo.globalNo + '</a>';
  }

  const destinations = winnerChip + loserChip;

  const rows = '<div class="match-rows">'
    + (m.top    ? renderRow(m.top, topWin)    : tbdRow())
    + (m.bottom ? renderRow(m.bottom, botWin) : tbdRow())
    + '</div>';

  // Footer: schedule (day · time · payout) left, table right. One line.
  const when = (scheduleDay || scheduleTime || schedulePay)
    ? '<span class="when">'
      + (scheduleDay  ? '<span class="day">'  + esc(scheduleDay)  + '</span>' : '')
      + (scheduleTime ? '<span class="time">' + esc(scheduleTime) + '</span>' : '')
      + (schedulePay  ? '<span class="pay">'  + esc(schedulePay)  + '</span>' : '')
      + '</span>'
    : '<span class="when"></span>';
  const foot = '<div class="match-foot">'
    +   when
    +   '<span class="table">' + esc(tableLabel) + '</span>'
    + '</div>';

  const idAttr = m.globalNo ? ' id="m' + m.globalNo + '"' : '';
  const stripeStyle = stripeColor ? ' style="--stripe:' + stripeColor + '"' : '';
  const finalCls = isFinalOfBracket ? ' is-final-of-bracket' : '';
  return '<div class="match' + finalCls + '" data-match-id="' + m.id + '" data-global-no="' + (m.globalNo || '') + '"' + idAttr + stripeStyle + '>'
    + '<div class="match-stripe"></div>'
    + '<div class="match-top">'
    +   '<span class="mno">' + esc(tnum) + '</span>'
    +   '<span class="destinations">' + destinations + '</span>'
    + '</div>'
    + rows
    + foot
    + '</div>';
}

function byeMatchHtml(m, stripeColor) {
  const team = m.top;
  const mnoLabel = m.globalNo ? 'M' + m.globalNo : '—';
  let advanceChip = '';
  if (m.winnerAdvancesTo) {
    advanceChip = '<a class="dest-chip win" data-jump="' + m.winnerAdvancesTo.globalNo
      + '" href="#m' + m.winnerAdvancesTo.globalNo
      + '" title="Auto-advances to M' + m.winnerAdvancesTo.globalNo + '">&rarr; M'
      + m.winnerAdvancesTo.globalNo + '</a>';
  }
  const idAttr = m.globalNo ? ' id="m' + m.globalNo + '"' : '';
  const stripeStyle = stripeColor ? ' style="--stripe:' + stripeColor + '"' : '';
  // The advancing slot — the seeded team, or TBD when no team is
  // assigned yet (empty / partial roster). Guard every team.* access:
  // m.top is null until a team is seeded into this bye.
  const advancingRow = team
    ? '<div class="match-row winner" data-team="' + esc((team.name || '').toLowerCase()) + '" data-team-num="' + team.number + '">'
      +   '<span class="seed">' + esc(team.seed) + '</span>'
      +   '<span class="team-num">' + pad4(team.number) + '</span>'
      +   '<span class="name" title="' + esc(team.name) + '">' + esc(team.name) + '</span>'
      +   '<span class="trophy" aria-label="Advances">&#x21E2;</span>'
      + '</div>'
    : '<div class="match-row">'
      +   '<span class="seed">&mdash;</span>'
      +   '<span class="team-num">&mdash;</span>'
      +   '<span class="name" style="color:var(--muted);font-style:italic">TBD</span>'
      +   '<span class="trophy"></span>'
      + '</div>';
  return '<div class="match bye" data-match-id="' + m.id + '" data-global-no="' + (m.globalNo || '') + '"' + idAttr + stripeStyle + '>'
    + '<div class="match-stripe"></div>'
    + '<div class="match-top">'
    +   '<span class="mno">' + esc(mnoLabel) + '<span class="bye-tag">BYE</span></span>'
    +   '<span class="destinations">' + advanceChip + '</span>'
    + '</div>'
    + '<div class="match-rows">'
    +   advancingRow
    +   '<div class="match-row bye-row">'
    +     '<span class="seed">&mdash;</span>'
    +     '<span class="team-num">&mdash;</span>'
    +     '<span class="name">BYE</span>'
    +     '<span class="trophy"></span>'
    +   '</div>'
    + '</div>'
    + '<div class="match-foot"><span class="when"></span><span class="table"></span></div>'
    + '</div>';
}

function tbdRow() {
  return '<div class="match-row"><span class="seed">—</span><span class="team-num">—</span>'
       + '<span class="name" style="color:var(--muted);font-style:italic">TBD</span>'
       + '<span class="trophy"></span></div>';
}

function renderRow(team, isWinner) {
  const cls = 'match-row ' + (isWinner ? 'winner' : 'loser');
  return '<div class="' + cls + '" data-team="' + esc((team.name || '').toLowerCase()) + '" data-team-num="' + team.number + '">'
    + '<span class="seed">' + esc(team.seed) + '</span>'
    + '<span class="team-num" title="Team number">' + pad4(team.number) + '</span>'
    + '<span class="name" title="' + esc(team.name) + '">' + esc(team.name) + '</span>'
    + '<span class="trophy" aria-label="Winner">&#x1F3C6;</span>'
    + '</div>';
}

/* Connectors: drawn inside the bracket-svg in design-unit coordinates.
 *  Each connector traces one TEAM's advancement path. For every match m
 *  and every intra-bracket feeder f, draw a line from:
 *    • feeder's WINNER ROW (right edge)       — where the team comes from
 *    • to downstream's SPECIFIC ROW (left)    — where that team appears
 *  Two-feeder downstream → two independent lines, top feeder → top row,
 *  bot feeder → bot row. Right-angle Z routing; flat horizontal when Ys
 *  match. Cross-bracket loser drops are text annotations only.
 *
 *  Coordinates are computed from match metadata, NOT from DOM measurement.
 *  This is the SVG win: paths and cards share the SAME coordinate space, so
 *  there's no measure-then-draw race. */
const ROW_TOP_OFFSET_FROM_CARD = 56;   // ~ top row's Y inside card (header band + half rowH)
const ROW_BOT_OFFSET_FROM_CARD = 96;   // ~ bottom row's Y inside card

function cellGeomFor(m) {
  // Pull rounds from match metadata. For each bracket the match's
  // round index is m.round (1-based). Convert to design coordinates.
  const roundIdx = m.round - 1;
  const xL = roundXLeft(roundIdx);
  const top = matchTopY(m);
  return {
    left:  xL,
    right: xL + SVG.CARD_W,
    cy:    top + SVG.CARD_H / 2,
    topRowY: top + ROW_TOP_OFFSET_FROM_CARD,
    botRowY: top + ROW_BOT_OFFSET_FROM_CARD
  };
}

function drawConnectorsFor(wrap, matches) {
  const svgEl = wrap.querySelector('svg.bracket-svg');
  if (!svgEl) return;
  const connLayer = svgEl.querySelector('g.connectors-layer');
  const crossLayer = svgEl.querySelector('g.cross-source-layer');
  if (!connLayer || !crossLayer) return;
  connLayer.innerHTML = '';
  crossLayer.innerHTML = '';
  const STROKE = '#94a3b8';
  const STROKE_W = '2';

  const drawPath = (d) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', STROKE);
    p.setAttribute('stroke-width', STROKE_W);
    p.setAttribute('stroke-linejoin', 'round');
    p.setAttribute('stroke-linecap', 'round');
    connLayer.appendChild(p);
  };

  for (const m of matches) {
    const down = cellGeomFor(m);
    const feeders = [];
    if (m.topFromMatch) feeders.push({ feeder: m.topFromMatch, side: 'top' });
    if (m.botFromMatch) feeders.push({ feeder: m.botFromMatch, side: 'bot' });

    // Intra-bracket connectors (drawn solid).
    for (const { feeder, side } of feeders) {
      const f = cellGeomFor(feeder);
      let y1 = f.cy;
      if (feeder.topWins === true)  y1 = f.topRowY;
      if (feeder.topWins === false) y1 = f.botRowY;
      const y2 = side === 'top' ? down.topRowY : down.botRowY;
      const x1 = f.right, x2 = down.left;
      const xMid = (x1 + x2) / 2;
      if (Math.abs(y1 - y2) < 0.5) {
        drawPath('M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2);
      } else {
        drawPath('M ' + x1 + ' ' + y1 + ' L ' + xMid + ' ' + y1
               + ' L ' + xMid + ' ' + y2 + ' L ' + x2 + ' ' + y2);
      }
    }

    // Cross-bracket source stubs.
    const intraRanges = intraFeederYRanges(m);
    if (m.topFromMatchLoser) {
      const targetNo = m.topFromMatchLoser.globalNo;
      const label = 'L of M' + targetNo;
      if (inAnyRange(down.topRowY, intraRanges))
        drawCrossSourceL(crossLayer, down.left, down.topRowY, 'top', label, targetNo);
      else
        drawCrossSource(crossLayer, down.left, down.topRowY, label, targetNo);
    }
    if (m.botFromMatchLoser) {
      const targetNo = m.botFromMatchLoser.globalNo;
      const label = 'L of M' + targetNo;
      if (inAnyRange(down.botRowY, intraRanges))
        drawCrossSourceL(crossLayer, down.left, down.botRowY, 'bot', label, targetNo);
      else
        drawCrossSource(crossLayer, down.left, down.botRowY, label, targetNo);
    }
  }
}

function intraFeederYRanges(m) {
  const ranges = [];
  const down = cellGeomFor(m);
  const addRange = (feeder, targetY) => {
    const f = cellGeomFor(feeder);
    let y1 = f.cy;
    if (feeder.topWins === true)  y1 = f.topRowY;
    if (feeder.topWins === false) y1 = f.botRowY;
    ranges.push([Math.min(y1, targetY), Math.max(y1, targetY)]);
  };
  if (m.topFromMatch) addRange(m.topFromMatch, down.topRowY);
  if (m.botFromMatch) addRange(m.botFromMatch, down.botRowY);
  return ranges;
}

function inAnyRange(y, ranges) {
  const PAD = 3;  // generous so labels never visually graze the connector
  for (const [lo, hi] of ranges) {
    if (y >= lo - PAD && y <= hi + PAD) return true;
  }
  return false;
}

/* Straight horizontal stub + label at the target row's Y. Used when the
 * downstream match has NO intra-bracket feeder (e.g. 64-team R1, where both
 * rows are cross-bracket loser drops, so there's no Z-path to collide with).
 * jumpToNo (optional): if present, the label becomes a clickable hyperlink
 * to that match's global match number. */
function drawCrossSource(svg, x, y, label, jumpToNo) {
  appendCrossPath(svg, 'M ' + (x - 22) + ' ' + y + ' L ' + x + ' ' + y);
  appendCrossLabel(svg, x - 26, y, label, jumpToNo);
}

/* L-shaped variant. Label parks OUTSIDE the target row (just above for
 * top targets, just below for bot targets), and the dashed path bends
 * INTO the row from outside. */
function drawCrossSourceL(svg, x, rowY, side, label, jumpToNo) {
  const STUB = 22;
  const OFFSET = 14;
  const VERT_X = x - 10;
  const labelY = side === 'top' ? rowY - OFFSET : rowY + OFFSET;
  const d = 'M ' + (x - STUB) + ' ' + labelY
        + ' L ' + VERT_X + ' ' + labelY
        + ' L ' + VERT_X + ' ' + rowY
        + ' L ' + x + ' ' + rowY;
  appendCrossPath(svg, d);
  appendCrossLabel(svg, x - 26, labelY, label, jumpToNo);
}

function appendCrossPath(svg, d) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', '#b45309');
  p.setAttribute('stroke-width', '1.5');
  p.setAttribute('stroke-dasharray', '3 3');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(p);
}

function appendCrossLabel(svg, x, y, label, jumpToNo) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', x);
  t.setAttribute('y', y);
  t.setAttribute('text-anchor', 'end');
  t.setAttribute('dominant-baseline', 'middle');
  t.setAttribute('fill', '#b45309');
  t.setAttribute('font-size', '10.5');
  t.setAttribute('font-weight', '800');
  t.setAttribute('font-family', 'system-ui, -apple-system, "Segoe UI", sans-serif');
  t.setAttribute('letter-spacing', '0.04em');
  t.textContent = label;
  if (jumpToNo) {
    t.setAttribute('data-jump', jumpToNo);
    t.setAttribute('class', 'cross-source-link');
    t.setAttribute('title', 'Jump to M' + jumpToNo);
  }
  svg.appendChild(t);
}
function cssEscape(s) { return String(s).replace(/(["\\])/g, '\\$1'); }

/* Populate the hero section (tournament name, dates, venue, status). Called
 * after the active tournament loads and after any live re-fetch. Hides the
 * hero entirely when no DB row is loaded (inline-template fallback). */
function renderHero() {
  const hero = document.getElementById('tournamentHero');
  if (!hero) return;
  const t = _tournamentRow;
  if (!t || !t.name) { hero.hidden = true; return; }
  hero.hidden = false;
  document.getElementById('tournamentName').textContent = t.name;

  // Metadata line: <date range> · <venue>
  const parts = [];
  const fmtDate = (iso) => {
    if (!iso) return null;
    const d = new Date(iso + 'T12:00:00');
    if (isNaN(d.getTime())) return null;
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  };
  const startStr = fmtDate(t.start_date);
  const endStr   = fmtDate(t.end_date);
  if (startStr && endStr && startStr !== endStr) parts.push(startStr + ' &rarr; ' + endStr);
  else if (startStr) parts.push(startStr);
  if (t.venue_name) parts.push(esc(t.venue_name));
  document.getElementById('tournamentMeta').innerHTML = parts.join('<span class="sep">·</span>');

  // Live-status badge near the title
  const statusEl = document.getElementById('tournamentHeroStatus');
  if (t.status === 'live') {
    statusEl.hidden = false;
    statusEl.innerHTML = '<span class="pulse"></span> LIVE';
  } else if (t.status === 'completed') {
    statusEl.hidden = false;
    statusEl.style.background = 'rgba(0,49,161,0.10)';
    statusEl.style.color = 'var(--spm-accent)';
    statusEl.textContent = 'COMPLETED';
  } else {
    statusEl.hidden = true;
  }
}

/* ════════════════════════════════════════════════════════════════════════
   WIRING-DRIVEN ENGINE (preprod, ?engine=wiring opt-in)
   ─────────────────────────────────────────────────────────────────
   Engine v0.4 — validated against mse-32-to-8 and mod-se-12-12-to-64
   templates (see tools/claude/breakout/validate-engine.mjs). Originated
   as a parallel-file at Apps/BreakOut/site/staging.html during the
   overnight 2026-05-24 build; that file was deleted 2026-05-25 once the
   preprod policy gave the engine a proper home here. These pure
   functions are the
   replacement layout brain. They do NOT render — render still goes
   through bracketSectionHtml + drawConnectorsFor — but they SUPPLY
   the per-match (column, row) positions, arm classification, and
   terminal flags that the renderer needs.

   Why feature-flagged: production's renderTournament assumes hardcoded
   A/B/T64 bracket structure with hardcoded round counts. Swapping to
   wiring-driven detection has to be validated against every live
   tournament without breaking any of them. URL param `?engine=wiring`
   is the smoke-test escape hatch; once smoke-test passes, promote.sh
   collapses preprod -> prod and the flag becomes the default.
   ════════════════════════════════════════════════════════════════════════ */

/* Classify each match into one of three arms: 'center' (R1), 'W'
   (winners' arm), or 'L' (losers'/consolation arm). Rules:
     • Round 1 → 'center'
     • Round N ≥ 2 → 'L' if ANY input has kind=='loser' OR the source
       match is already classified as 'L'. Otherwise 'W'. */
function wiringDetectArms(matches) {
  const byId = Object.fromEntries(matches.map(m => [m.id, m]));
  const arms = {};
  const byRound = {};
  for (const m of matches) (byRound[m.round] = byRound[m.round] || []).push(m);
  const rounds = Object.keys(byRound).map(Number).sort((a, b) => a - b);
  for (const r of rounds) {
    for (const m of byRound[r]) {
      if (r === 1) { arms[m.id] = 'center'; continue; }
      const inputs = [m.top_from, m.bot_from].filter(Boolean);
      // Cross-bracket inputs describe where a team came from, not this
      // bracket's internal flow. Filter them out before arm classification.
      const sameBracketInputs = inputs.filter(inp => byId[inp.match_id]);

      // Rule 1: any SAME-BRACKET loser-kind input → L (consolation flow
      // within this bracket). Cross-bracket loser-kinds (e.g. 64.R3's top
      // taking A.R3's loser) describe team origin, not L-arm wiring.
      if (sameBracketInputs.some(inp => inp.kind === 'loser')) {
        arms[m.id] = 'L';
        continue;
      }

      // Rule 2a: no same-bracket inputs at all (pure cross-bracket integration
      // rounds like 12-12-64's 64.R1 / R3 / R5) → default W.
      if (sameBracketInputs.length === 0) {
        arms[m.id] = 'W';
        continue;
      }

      // Rule 2b: all same-bracket inputs are winner-kind. If ANY same-bracket
      // source is W or center → this match is W. Only fall to L when every
      // same-bracket source is also L (a pure consolation chain like 32→8's
      // R4_L). Integration rounds like 48→8's R4 (top from W-arm R3 + bot from
      // L-arm L_R3, both winner-kind) correctly land on W via this rule.
      let hasNonL = false;
      for (const inp of sameBracketInputs) {
        if (arms[byId[inp.match_id].id] !== 'L') { hasNonL = true; break; }
      }
      arms[m.id] = hasNonL ? 'W' : 'L';
    }
  }
  return arms;
}

/* Terminal = qualifier. Match is terminal if is_qualifier===true OR
   nothing downstream references it (no other match's top_from/bot_from
   points back). Used to drive the 🏆 QUALIFIED badge + the per-bracket
   qualifier header band. */
function wiringDetectTerminals(matches) {
  const referenced = new Set();
  for (const m of matches) {
    if (m.top_from) referenced.add(m.top_from.match_id);
    if (m.bot_from) referenced.add(m.bot_from.match_id);
  }
  const terminal = {};
  for (const m of matches) {
    terminal[m.id] = !!m.is_qualifier || !referenced.has(m.id);
  }
  return terminal;
}

/* Compute (col, row) for each match.
     col = ±(round-1), sign by arm; center (R1) = 0
     row = R1 stacks linearly by slot; non-R1 averages same-arm inputs
   Cross-arm inputs (loser drops) influence label-rendering but NOT
   the Y position — otherwise W-arm losers pull L-arm matches into a
   crooked layout. */
function wiringComputePositions(matches, arms) {
  const byId = Object.fromEntries(matches.map(m => [m.id, m]));
  const pos = {};
  const r1 = matches.filter(m => m.round === 1).sort((a, b) => a.slot - b.slot);
  r1.forEach((m, i) => { pos[m.id] = { col: 0, row: i }; });
  const nonR1 = matches.filter(m => m.round !== 1)
    .sort((a, b) => a.round - b.round || a.slot - b.slot);
  for (const m of nonR1) {
    const arm = arms[m.id];
    const col = (arm === 'L' ? -1 : 1) * (m.round - 1);
    const inputs = [m.top_from, m.bot_from].filter(Boolean);
    const sameArmRows = inputs.map(inp => {
      const src = byId[inp.match_id];
      if (!src) return null;
      const srcArm = arms[src.id];
      if (srcArm === 'center' || srcArm === arm) {
        return pos[src.id] ? pos[src.id].row : null;
      }
      return null;
    }).filter(r => r !== null);
    let row;
    if      (sameArmRows.length === 2) row = (sameArmRows[0] + sameArmRows[1]) / 2;
    else if (sameArmRows.length === 1) row = sameArmRows[0];
    else                               row = m.slot;
    pos[m.id] = { col, row };
  }
  return pos;
}

/* Group matches by their `bracket` string so multi-bracket templates
   (A, B, 64) render as independent sections with independent lane
   detection. Returns ordered array of { label, matches }. */
function wiringGroupByBracket(matches) {
  const by = {};
  for (const m of matches) {
    const b = m.bracket || 'default';
    (by[b] = by[b] || []).push(m);
  }
  const rank = (x) => ({ 'A': 1, 'B': 2, '32': 5, '64': 9 }[x] ?? (x.match(/^\d/) ? parseInt(x, 10) + 100 : 200));
  return Object.keys(by)
    .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b))
    .map(label => ({ label, matches: by[label] }));
}

/* Top-level helper used by renderTournament when WIRING_ENGINE is on.
   Returns per-bracket analysis the renderer can consume. */
function wiringAnalyzeTournament(allMatches) {
  return wiringGroupByBracket(allMatches).map(({ label, matches }) => {
    const arms      = wiringDetectArms(matches);
    const terminals = wiringDetectTerminals(matches);
    const positions = wiringComputePositions(matches, arms);
    const termCount = Object.values(terminals).filter(Boolean).length;
    return { label, matches, arms, terminals, positions, termCount };
  });
}

/* ════════════════════════════════════════════════════════════════════════
   WIRING-DRIVEN BRACKET RENDERER
   ─────────────────────────────────────────────────────────────────
   Lays out an arbitrary set of matches (any bracket label, any wiring
   shape) using positions from wiringComputePositions. Produces the
   same outer DOM shape as bracketSectionHtml so search / highlight /
   pan / zoom / print all keep working — but the brain is the engine.

   Coordinate system:
     col 0  = center R1 (cards stacked vertically by slot)
     col >0 = W arm, one column per round right of R1
     col <0 = L arm, one column per round left of R1
     row N  = N * SVG.SLOT_H from the top of the cards band

   Layout output for one bracket:
     • One <svg> per bracket with foreignObject HTML cards (parity with
       production's matchHtml output — chips, schedule, table, all
       reused unchanged via matchHtml(m, isFinal, stripeColor)).
     • Round headers at the top of each column.
     • Connectors layer + cross-source layer (same div ids as the
       classic renderer so drawConnectorsForWiring can paint into them).
   ════════════════════════════════════════════════════════════════════════ */

/* Determine if a bracket label should render a vertical red→blue stripe
   on its cards (per the 2026-05-25 design decision for the 32-bracket
   case). Drives the `.match.bracket-32` class hook in CSS. */
function wiringBracketCssClass(label) {
  if (label === '32') return 'bracket-32';
  return '';
}

/* Compute pixel geometry for a match. Takes the engine's GLOBAL (col,row)
   pair (signed col: -N to +N, row: minRow to maxRow) plus layout bounds,
   and normalizes to local 0-based pixel coords. */
function wiringCellGeom(globalPos, layout) {
  const localCol = globalPos.col - layout.minCol;
  const localRow = globalPos.row - layout.minRow;
  const xLeft   = SVG.LEFT_PAD + localCol * (SVG.CARD_W + SVG.ROUND_GAP);
  const yCenter = SVG.TOP_PAD + SVG.HEADER_H + (localRow + 0.5) * SVG.SLOT_H;
  const yTop    = yCenter - SVG.CARD_H / 2;
  return {
    left: xLeft,
    right: xLeft + SVG.CARD_W,
    top: yTop,
    bottom: yTop + SVG.CARD_H,
    cx: xLeft + SVG.CARD_W / 2,
    cy: yCenter,
    // Row Y coordinates for connector anchors — match the top/bot team
    // rows inside the card. ~18% off cy puts them near the team row
    // baselines without overlapping the match number band.
    topRowY: yCenter - SVG.CARD_H * 0.18,
    botRowY: yCenter + SVG.CARD_H * 0.18
  };
}

/* Per-column round-name label. The center column is R1; right cols are
   W2/W3/…; left cols are L2/L3/…. Returns null for cols outside the
   bracket (won't happen given layout, but guards anyway). */
function wiringRoundLabel(col) {
  if (col === 0) return 'Round 1';
  if (col > 0)   return 'W Round ' + (col + 1);
  return 'L Round ' + (Math.abs(col) + 1);
}

function wiringRenderBracket(displayLabel, label, matches, opts) {
  const analysis  = wiringAnalyzeTournament(matches);
  // analysis is [{label, matches, arms, terminals, positions, termCount}] —
  // but here we already know we're rendering ONE bracket, so use the first.
  const b = analysis[0] || { label, matches, arms: {}, terminals: {}, positions: {}, termCount: 0 };
  const arms = b.arms, terminals = b.terminals, positions = b.positions;

  // Layout bounds across all positions in this bracket.
  const rows = Object.values(positions).map(p => p.row);
  const cols = Object.values(positions).map(p => p.col);
  const minRow = rows.length ? Math.min(...rows) : 0;
  const maxRow = rows.length ? Math.max(...rows) : 0;
  const minCol = cols.length ? Math.min(...cols) : 0;
  const maxCol = cols.length ? Math.max(...cols) : 0;
  const numCols = (maxCol - minCol + 1);
  const numRows = (maxRow - minRow + 1);
  const w = SVG.LEFT_PAD + numCols * SVG.CARD_W + Math.max(0, numCols - 1) * SVG.ROUND_GAP + SVG.RIGHT_PAD;
  const h = SVG.TOP_PAD + SVG.HEADER_H + (numRows + 0.5) * SVG.SLOT_H + SVG.CHAMP_BAND_H;
  const layout = { w, h, minRow, maxRow, minCol, maxCol };

  // Bracket stripe color for the in-card stripe div. Falls back to the
  // accent gray (matches existing convention).
  const stripeColor = SVG.BRACKET_COLORS[label] || '#94a3b8';

  // Round headers: iterate every populated column, label by arm.
  let svgInner = '';
  for (let c = minCol; c <= maxCol; c++) {
    const colCells = matches.filter(m => positions[m.id] && positions[m.id].col === c);
    if (!colCells.length) continue;
    const cx = SVG.LEFT_PAD + (c - minCol) * (SVG.CARD_W + SVG.ROUND_GAP) + SVG.CARD_W / 2;
    const xL = SVG.LEFT_PAD + (c - minCol) * (SVG.CARD_W + SVG.ROUND_GAP);
    const xR = xL + SVG.CARD_W;
    const headerText = wiringRoundLabel(c);
    svgInner += '<text class="round-name" x="' + cx + '" y="' + (SVG.TOP_PAD + SVG.HEADER_TEXT_Y)
              + '" text-anchor="middle" dominant-baseline="alphabetic">' + esc(headerText) + '</text>';
    svgInner += '<line class="round-header-underline" x1="' + xL + '" y1="' + (SVG.TOP_PAD + SVG.HEADER_H - 6)
              + '" x2="' + xR + '" y2="' + (SVG.TOP_PAD + SVG.HEADER_H - 6) + '"/>';
    if (c > minCol) {
      const dividerX = xL - SVG.ROUND_GAP / 2;
      const topY = SVG.TOP_PAD + SVG.HEADER_H;
      const botY = SVG.TOP_PAD + SVG.HEADER_H + numRows * SVG.SLOT_H;
      svgInner += '<line class="round-divider" x1="' + dividerX + '" y1="' + topY
                + '" x2="' + dividerX + '" y2="' + botY + '"/>';
    }
  }

  // Connectors + cross-source layers (painted in JS pass after innerHTML).
  svgInner += '<g class="connectors-layer"></g>';
  svgInner += '<g class="cross-source-layer"></g>';

  // Card foreignObjects.
  const bracketCssClass = wiringBracketCssClass(label);
  for (const m of matches) {
    const pos = positions[m.id];
    if (!pos) continue;
    const geom = wiringCellGeom(pos, layout);
    // Pass isFinalOfBracket=false so matchHtml doesn't add its in-card
    // "is-final-of-bracket" gradient strip — the wiring engine handles
    // terminal emphasis via a SEPARATE pill below the card (see below).
    const cardHtml = m.bye ? byeMatchHtml(m, stripeColor) : matchHtml(m, false, stripeColor);
    // Optional bracket-specific class injection (e.g. .bracket-32 for
    // the red→blue gradient stripe). The card root is .match — quick
    // string-rewrite is simplest and avoids cloning matchHtml.
    const cardHtmlAdj = bracketCssClass
      ? cardHtml.replace('class="match', 'class="match ' + bracketCssClass)
      : cardHtml;
    svgInner += '<foreignObject class="card-fo" data-match-fo="' + esc(m.id)
              + '" x="' + geom.left + '" y="' + geom.top
              + '" width="' + SVG.CARD_W + '" height="' + SVG.CARD_H + '">'
              + '<div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%">'
              + cardHtmlAdj
              + '</div></foreignObject>';

    // ── Terminal qualifier pill ──────────────────────────────────────
    // For each terminal (is_qualifier OR no downstream wiring) match,
    // render a "🏆 <bracketChampText>" pill BELOW the card using the
    // same foreignObject pattern + .bracket-champ-big visual the classic
    // renderer uses for bracket finals. Sits outside the card so it
    // can be loud — gradient pill with bounce animation.
    // Same sizing constants as bracketSectionHtml (lines ~2063-2083).
    if (terminals[m.id] && !m.bye) {
      const PILL_W = 260;
      const PILL_VISIBLE_H = 50;
      const PILL_PAD = 20;
      const PILL_H = PILL_VISIBLE_H + PILL_PAD * 2;
      const pillX = geom.cx - PILL_W / 2;
      const pillY = (geom.cy + SVG.CARD_H / 2 + 6) - PILL_PAD;
      svgInner += '<foreignObject class="champ-fo" data-match-fo="' + esc(m.id) + '-champ"'
                + ' x="' + pillX + '" y="' + pillY
                + '" width="' + PILL_W + '" height="' + PILL_H
                + '"><div xmlns="http://www.w3.org/1999/xhtml" '
                + 'style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:visible">'
                + '<div class="bracket-champ-big">&#x1F3C6; ' + esc(TOURNAMENT_TEXT.bracketChampText) + '</div>'
                + '</div></foreignObject>';
    }
  }

  // Outer svg.
  const svg = '<svg class="bracket-svg" xmlns="http://www.w3.org/2000/svg" '
            + 'data-wrap="' + esc(label) + '" '
            + 'data-engine="wiring" '
            + 'viewBox="0 0 ' + w + ' ' + h + '" '
            + 'preserveAspectRatio="xMinYMin meet" '
            + 'style="width:' + w + 'px;height:' + h + 'px">'
            + svgInner + '</svg>';

  // Optional qualifier band: shown when this bracket has any terminal
  // matches. Reads "🏆 N World Qualifiers" + sub-line. Sits above the
  // bracket SVG within the section.
  let qualifierBand = '';
  if (b.termCount > 0) {
    qualifierBand = '<div class="qualifier-band">🏆 ' + b.termCount + ' World Qualifier'
                  + (b.termCount === 1 ? '' : 's')
                  + '<div class="qb-sub">Terminal matches feed straight to World Pool Championships</div>'
                  + '</div>';
  }

  return '<div class="bracket-section" data-bracket="' + esc(label) + '" data-design-w="' + w + '" data-design-h="' + h + '" data-engine="wiring">'
       + '<div class="section-title"><span class="pill ' + (opts.pillClass || '') + '">' + esc(displayLabel) + '</span></div>'
       + qualifierBand
       + '<div class="viewport"><div class="bracket-wrap" data-wrap="' + esc(label) + '" data-engine="wiring">'
       +   svg
       + '</div></div>'
       + '</div>';
}

/* Draw connectors for a wiring-rendered bracket. Same-arm wires only
   (cross-arm = label, not line). For each match m:
     • For each input (top_from / bot_from), look up the source.
     • If source is same-arm OR center, draw a wire from src right/left
       (depending on dst arm) to dst's top or bot row.
     • If cross-arm (kind='loser' from W into L, or vice versa), render
       a "L of M<n>" / "W of M<n>" stub label outside the dst card. */
function wiringDrawConnectors(wrap, matches, analysis) {
  const svgEl = wrap.querySelector('svg.bracket-svg');
  if (!svgEl) return;
  const connLayer  = svgEl.querySelector('g.connectors-layer');
  const crossLayer = svgEl.querySelector('g.cross-source-layer');
  if (!connLayer || !crossLayer) return;
  connLayer.innerHTML  = '';
  crossLayer.innerHTML = '';

  const positions = analysis.positions;
  const arms      = analysis.arms;
  const rowsArr = Object.values(positions).map(p => p.row);
  const colsArr = Object.values(positions).map(p => p.col);
  const minRow = rowsArr.length ? Math.min(...rowsArr) : 0;
  const maxRow = rowsArr.length ? Math.max(...rowsArr) : 0;
  const minCol = colsArr.length ? Math.min(...colsArr) : 0;
  const maxCol = colsArr.length ? Math.max(...colsArr) : 0;
  const layout = { minRow, maxRow, minCol, maxCol };

  const byId = Object.fromEntries(matches.map(m => [m.id, m]));
  const STROKE = '#94a3b8';

  const drawPath = (d) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', STROKE);
    p.setAttribute('stroke-width', '2');
    p.setAttribute('stroke-linejoin', 'round');
    p.setAttribute('stroke-linecap', 'round');
    connLayer.appendChild(p);
  };

  for (const m of matches) {
    const dstPos = positions[m.id];
    if (!dstPos) continue;
    const dstGeom = wiringCellGeom(dstPos, layout);
    const myArm = arms[m.id];

    const inputs = [
      { from: m.top_from, side: 'top' },
      { from: m.bot_from, side: 'bot' }
    ].filter(x => x.from);

    for (const { from, side } of inputs) {
      const src = byId[from.match_id];
      if (!src) continue;
      const srcPos = positions[src.id];
      if (!srcPos) {
        // Cross-bracket reference (source lives in a different bracket).
        // Render as label only.
        const targetNo = src.match_no || src.globalNo || src.id;
        const kindShort = from.kind === 'loser' ? 'L' : 'W';
        const rowY = side === 'top' ? dstGeom.topRowY : dstGeom.botRowY;
        const labelX = myArm === 'L' ? dstGeom.right : dstGeom.left;
        const dir = myArm === 'L' ? +1 : -1;
        const labelText = kindShort + ' of M' + targetNo;
        // Stub + label.
        const stubX1 = labelX;
        const stubX2 = labelX + dir * 22;
        crossLayer.appendChild(buildCrossPath('M ' + stubX1 + ' ' + rowY + ' L ' + stubX2 + ' ' + rowY));
        crossLayer.appendChild(buildCrossLabel(stubX2 + dir * 4, rowY, labelText, targetNo, dir));
        continue;
      }
      const srcArm = arms[src.id];
      const srcGeom = wiringCellGeom(srcPos, layout);

      // True cross-arm: source's arm differs from dst's AND source is
      // not the center column. (Center R1 → L-arm R2 via loser-kind is
      // a normal drop line, NOT a cross-arm skip — the wire flows
      // naturally because center is column 0.) Match staging.html v0.4
      // behavior: skip only when both arms are explicit and different.
      const isCrossArm = (srcArm !== 'center') && (srcArm !== myArm);
      if (isCrossArm) {
        const targetNo = src.match_no || src.globalNo || src.id;
        const kindShort = from.kind === 'loser' ? 'L' : 'W';
        const labelText = kindShort + ' of M' + targetNo;
        const rowY = side === 'top' ? dstGeom.topRowY : dstGeom.botRowY;
        const labelX = myArm === 'L' ? dstGeom.right : dstGeom.left;
        const dir = myArm === 'L' ? +1 : -1;
        const stubX1 = labelX;
        const stubX2 = labelX + dir * 22;
        crossLayer.appendChild(buildCrossPath('M ' + stubX1 + ' ' + rowY + ' L ' + stubX2 + ' ' + rowY));
        crossLayer.appendChild(buildCrossLabel(stubX2 + dir * 4, rowY, labelText, targetNo, dir));
        continue;
      }

      // Same-arm intra-bracket wire (or center → arm flow).
      // Source-side anchor: pick row based on src result if known, else
      // use src.cy (no result yet — center).
      let y1 = srcGeom.cy;
      if (src.topWins === true)  y1 = srcGeom.topRowY;
      if (src.topWins === false) y1 = srcGeom.botRowY;
      const y2 = side === 'top' ? dstGeom.topRowY : dstGeom.botRowY;

      // X anchors depend on direction of flow (dst arm).
      let x1, x2;
      if (myArm === 'L') {
        // Flows right→left. Exit src.left, enter dst.right.
        x1 = srcGeom.left;
        x2 = dstGeom.right;
      } else {
        // Flows left→right (W arm, or R1→R2 in center→W).
        x1 = srcGeom.right;
        x2 = dstGeom.left;
      }
      const xMid = (x1 + x2) / 2;
      if (Math.abs(y1 - y2) < 0.5) {
        drawPath('M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2);
      } else {
        drawPath('M ' + x1 + ' ' + y1 + ' L ' + xMid + ' ' + y1
               + ' L ' + xMid + ' ' + y2 + ' L ' + x2 + ' ' + y2);
      }
    }
  }
}

function buildCrossPath(d) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', d);
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', '#b45309');
  p.setAttribute('stroke-width', '1.5');
  p.setAttribute('stroke-dasharray', '3 3');
  p.setAttribute('stroke-linecap', 'round');
  return p;
}
function buildCrossLabel(x, y, text, jumpToNo, dir) {
  const ns = 'http://www.w3.org/2000/svg';
  const t = document.createElementNS(ns, 'text');
  t.setAttribute('class', 'cross-source-link');
  t.setAttribute('x', String(x));
  t.setAttribute('y', String(y));
  t.setAttribute('dominant-baseline', 'middle');
  t.setAttribute('text-anchor', dir > 0 ? 'start' : 'end');
  t.textContent = text;
  if (jumpToNo) {
    t.setAttribute('data-jump', String(jumpToNo));
    t.setAttribute('style', 'cursor:pointer');
  }
  return t;
}

function renderTournament() {
  const t = _tournament;
  if (!t) return;

  // PREPROD: when ?engine=wiring is set, drive the entire render off
  // the wiring engine. Group t.all by bracket label, run the engine
  // per bracket, and use wiringRenderBracket() for layout.
  // Otherwise fall through to the classic A/B/T64 path (preserved
  // unchanged) so the preprod URL with no flag matches production for
  // any tournament the classic renderer already handles.
  if (WIRING_ENGINE) {
    return renderTournamentWiring(t);
  }

  // ── Classic A/B/T64 path (unchanged from production) ──
  const ab = (label, bracket, kind, cls) => bracketSectionHtml(
    bracket, kind,
    Array.from({ length: 4 }, (_, i) => bracket.matches.filter(m => m.round === i + 1)),
    { label, pillClass: cls }
  );
  const root = document.getElementById('tournamentRoot');
  let html = '';
  html += ab(TOURNAMENT_TEXT.bracketNameA, t.A, 'twelve', '');
  html += ab(TOURNAMENT_TEXT.bracketNameB, t.B, 'twelve', 'alt');
  html += bracketSectionHtml(
    t.T64, 'sixtyfour',
    Array.from({ length: 6 }, (_, i) => t.T64.matches.filter(m => m.round === i + 1)),
    { label: TOURNAMENT_TEXT.bracketNameT64, pillClass: 'consolation' }
  );
  root.innerHTML = html;
  renderHero();

  requestAnimationFrame(() => {
    document.querySelectorAll('.bracket-wrap[data-wrap]').forEach(wrap => {
      const label = wrap.dataset.wrap;
      const matches = label === 'A' ? t.A.matches : label === 'B' ? t.B.matches : t.T64.matches;
      drawConnectorsFor(wrap, matches);
    });
    applyZoomToSvgs();
    setupPanScroll();
    pinTitlesToViewport();
    applySearch();
    if (_highlightedTeam !== null) {
      const team = _highlightedTeam;
      _highlightedTeam = null;
      highlightTeamMatches(team);
    }
    if (!_initialScrollDone) {
      _initialScrollDone = true;
      const ps = document.getElementById('pageScroll');
      const firstSec = document.querySelector('.bracket-section');
      if (ps && firstSec) {
        const psRect  = ps.getBoundingClientRect();
        const secRect = firstSec.getBoundingClientRect();
        ps.scrollLeft += secRect.left - psRect.left;
        ps.scrollTop  += secRect.top  - psRect.top;
      }
    }
  });
}

/* Wiring-engine render path. Groups t.all by m.bracket and renders one
   section per bracket via wiringRenderBracket. Bracket display label
   comes from TOURNAMENT_TEXT for known labels (A/B/T64) and falls back
   to "Bracket <label>" otherwise. */
function renderTournamentWiring(t) {
  const root = document.getElementById('tournamentRoot');
  // Group all matches by bracket label.
  const byBracket = {};
  for (const m of t.all) {
    const b = m.bracket || 'default';
    (byBracket[b] = byBracket[b] || []).push(m);
  }
  // Sort labels: known A/B first, then numerics ascending, then alpha.
  const rank = (x) => ({ 'A': 1, 'B': 2, '32': 5, '64': 9 }[x] ?? (x.match(/^\d/) ? parseInt(x, 10) + 100 : 200));
  const labels = Object.keys(byBracket).sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  // Cache per-bracket analysis so the connector-drawing pass doesn't
  // re-run the engine. Keyed by bracket label.
  const analysisByLabel = {};
  let html = '';
  for (const label of labels) {
    const matches = byBracket[label];
    const displayLabel =
      label === 'A'  ? TOURNAMENT_TEXT.bracketNameA   :
      label === 'B'  ? TOURNAMENT_TEXT.bracketNameB   :
      label === '64' ? TOURNAMENT_TEXT.bracketNameT64 :
      'Bracket ' + label;
    const pillClass =
      label === 'A'  ? '' :
      label === 'B'  ? 'alt' :
      label === '64' ? 'consolation' :
      label === '32' ? 'mod-se-32' :
      '';
    const analysis = wiringAnalyzeTournament(matches);
    analysisByLabel[label] = analysis[0];
    html += wiringRenderBracket(displayLabel, label, matches, { pillClass });
  }
  root.innerHTML = html;
  renderHero();

  // Expose the latest analysis for devtools inspection.
  window._wiringAnalysis = analysisByLabel;

  requestAnimationFrame(() => {
    document.querySelectorAll('.bracket-wrap[data-engine="wiring"]').forEach(wrap => {
      const label = wrap.dataset.wrap;
      const matches = byBracket[label];
      const analysis = analysisByLabel[label];
      if (analysis) wiringDrawConnectors(wrap, matches, analysis);
    });
    applyZoomToSvgs();
    setupPanScroll();
    pinTitlesToViewport();
    applySearch();
    // Re-apply team highlight if active (bracket was just re-rendered).
    if (_highlightedTeam !== null) {
      const team = _highlightedTeam;
      _highlightedTeam = null;
      highlightTeamMatches(team);
    }
    // Initial scroll position: upper-left of Bracket A's SECTION (title +
    // bracket together). v0.79 dropped the wrap padding so the SVG is now
    // flush with its section's left edge, and the section title sits in
    // a sibling block at section.top. Scrolling to section.top lands the
    // user with the title at the top of the viewport and the bracket
    // immediately below — both visible. Only on initial render; data-poll
    // re-renders preserve the user's current scroll position.
    if (!_initialScrollDone) {
      _initialScrollDone = true;
      const ps = document.getElementById('pageScroll');
      const firstSec = document.querySelector('.bracket-section');
      if (ps && firstSec) {
        const psRect  = ps.getBoundingClientRect();
        const secRect = firstSec.getBoundingClientRect();
        ps.scrollLeft += secRect.left - psRect.left;
        ps.scrollTop  += secRect.top  - psRect.top;
      }
    }
  });
}
let _initialScrollDone = false;

/* ── Click-a-team highlight (viewer mode) ────
 *  Click any team's row in any match to spotlight every match that team
 *  appears in. Color-codes by outcome — green for wins, red for losses,
 *  SPM blue for matches not yet scored. The team's row gets a stronger
 *  background within each card. Click the same team again (or click
 *  outside any card) to clear. */
let _highlightedTeam = null;

function highlightTeamMatches(teamNumber) {
  if (_highlightedTeam === teamNumber) { clearTeamHighlight(); return; }
  clearTeamHighlight(true);  // silent — won't re-render
  _highlightedTeam = teamNumber;
  if (!_tournament) return;
  for (const m of _tournament.all) {
    const isTop = m.top    && m.top.number    === teamNumber;
    const isBot = m.bottom && m.bottom.number === teamNumber;
    if (!isTop && !isBot) continue;
    const el = document.querySelector('.match[data-match-id="' + cssEscape(m.id) + '"]');
    if (!el) continue;
    if (m.bye && isTop) {
      el.classList.add('highlight-win');     // bye = auto-advance = win
    } else if (m.winner_side === 'top' || m.winner_side === 'bot') {
      const teamSide = isTop ? 'top' : 'bot';
      el.classList.add(teamSide === m.winner_side ? 'highlight-win' : 'highlight-loss');
    } else {
      el.classList.add('highlight-pending');
    }
    const row = el.querySelector('.match-row[data-team-num="' + teamNumber + '"]');
    if (row) row.classList.add('highlight-team');
  }
  // Clear any active search highlight — the two modes don't coexist.
  document.querySelectorAll('.match.match-hit, .match.match-hit-latest').forEach(el => el.classList.remove('match-hit', 'match-hit-latest'));
  removeMatchHalos('search-hit-halo', 'search-hit-latest-halo');
  const si = document.getElementById('searchInput');
  if (si && si.value) {
    si.value = '';
    _searchQuery = '';
    document.getElementById('searchWrap').classList.remove('has-value');
    document.getElementById('searchResult').textContent = '';
  }
}

function clearTeamHighlight(silent) {
  if (_highlightedTeam == null) return;
  _highlightedTeam = null;
  document.querySelectorAll('.match.highlight-win, .match.highlight-loss, .match.highlight-pending').forEach(el => {
    el.classList.remove('highlight-win', 'highlight-loss', 'highlight-pending');
  });
  document.querySelectorAll('.match-row.highlight-team').forEach(el => el.classList.remove('highlight-team'));
}

// Viewer-only click delegation. Staff mode has its own handler that opens
// the score modal on match clicks — don't double-fire.
document.addEventListener('click', (e) => {
  if (IS_STAFF) return;
  if (e.target.closest('a.dest-chip')) return;       // chip click → jump
  const row = e.target.closest('.match-row[data-team-num]');
  if (row && row.dataset.teamNum) {
    const num = parseInt(row.dataset.teamNum, 10);
    if (Number.isInteger(num)) highlightTeamMatches(num);
    return;
  }
  // Click outside any match cell → clear highlight
  if (_highlightedTeam !== null && !e.target.closest('.match')) {
    clearTeamHighlight();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && _highlightedTeam !== null && !document.querySelector('.staff-modal-overlay.shown')) {
    clearTeamHighlight();
  }
});

/* ── Search ────────────────────────────────── */
let _searchQuery = '';
function applySearch() {
  const q = _searchQuery.trim().toLowerCase();
  const cells = document.querySelectorAll('.match');
  cells.forEach(m => m.classList.remove('match-hit', 'match-hit-latest'));
  // Wipe SVG halos from a prior search (or jump) before recomputing.
  removeMatchHalos('search-hit-halo', 'search-hit-latest-halo');
  const result = document.getElementById('searchResult');
  if (!q) { result.textContent = ''; return; }
  const hits = [];
  cells.forEach(m => {
    const rows = m.querySelectorAll('.match-row');
    let hit = false;
    rows.forEach(r => { if ((r.dataset.team || '').includes(q)) hit = true; });
    if (hit) { m.classList.add('match-hit'); hits.push(m); }
  });
  if (!hits.length) { result.textContent = 'No match found'; return; }
  // "Latest" = highest globalNo. (Earlier global rounds plays first.)
  let latest = null, maxNo = -1;
  hits.forEach(el => {
    const n = parseInt(el.dataset.globalNo, 10) || 0;
    if (n > maxNo) { maxNo = n; latest = el; }
  });
  // Paint halos: every hit gets a steady blue ring, the latest gets a
  // pulsing red ring on top of it so it's unmistakable when you arrive.
  hits.forEach(m => { if (m !== latest) addMatchHalo(m, 'search-hit-halo'); });
  if (latest) {
    latest.classList.add('match-hit-latest');
    addMatchHalo(latest, 'search-hit-latest-halo');
    latest.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  }
  result.textContent = hits.length + ' match' + (hits.length === 1 ? '' : 'es');
}
const _searchWrap = document.getElementById('searchWrap');
const _searchInput = document.getElementById('searchInput');
const _searchClear = document.getElementById('searchClear');
_searchInput.addEventListener('input', () => {
  _searchQuery = _searchInput.value;
  _searchWrap.classList.toggle('has-value', !!_searchInput.value);
  applySearch();
});
_searchInput.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { _searchInput.value = ''; _searchInput.dispatchEvent(new Event('input')); _searchInput.blur(); }
});
_searchClear.addEventListener('click', () => { _searchInput.value = ''; _searchInput.dispatchEvent(new Event('input')); _searchInput.focus(); });

/* ── Resize ─────────────────────────────────
 *  No connector redraw needed (SVG scales together with cards), but if the
 *  viewport reflows we may want to re-apply the density classes since the
 *  effective card width changes only with --zoom (not viewport width).
 *  The density depends only on zoom, so a no-op is fine here. Leaving the
 *  handler in place as a hook for future layout changes. */

window.addEventListener('resize', () => {
  if (_resizeRaf) return;
  _resizeRaf = requestAnimationFrame(() => { _resizeRaf = null; });
});

/* ── Jump-to-match on dest chips ──────────────
 *  Clicking "W → M37" or "L → M53" scrolls to the target match and
 *  pulses it with a flash highlight. Uses event delegation so it works
 *  for any re-rendered cards too. */
/* SVG-native halo overlay shared by jump-to-match AND search highlights.
 * The .match HTML lives inside a 240×136 <foreignObject> which clips any
 * effect that would extend beyond it (box-shadow, outline). The halo is a
 * stroked SVG rect drawn as a sibling of the foreignObject in the same
 * bracket-svg coordinate space — so it can radiate outside the clip. */

  const fo = target && target.closest && target.closest('foreignObject.card-fo');
  if (!fo) return null;
  const svg = fo.closest('svg.bracket-svg');
  if (!svg) return null;
  const x = parseFloat(fo.getAttribute('x'));
  const y = parseFloat(fo.getAttribute('y'));
  const w = parseFloat(fo.getAttribute('width'));
  const h = parseFloat(fo.getAttribute('height'));
  const PAD = padding != null ? padding : 10;
  const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  overlay.setAttribute('class', className);
  overlay.setAttribute('x',      String(x - PAD));
  overlay.setAttribute('y',      String(y - PAD));
  overlay.setAttribute('width',  String(w + 2 * PAD));
  overlay.setAttribute('height', String(h + 2 * PAD));
  overlay.setAttribute('rx', '12');
  overlay.setAttribute('ry', '12');

}
function removeMatchHalos() {
  // Remove every overlay class we own. Pass-through args lets callers be
  // selective (e.g. only remove search halos but keep jump halo).

    : ['match-jump-overlay', 'search-hit-halo', 'search-hit-latest-halo'];
  classes.forEach(cls => {
    document.querySelectorAll('.bracket-svg .' + cls).forEach(o => o.remove());
  });
}

function jumpToMatch(globalNo) {
  if (!globalNo) return;
  const target = document.querySelector('.match[data-global-no="' + globalNo + '"]');
  if (!target) return;
  target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });

  // SVG halo (drawn outside the foreignObject's clip).
  removeMatchHalos('match-jump-overlay');
  const overlay = addMatchHalo(target, 'match-jump-overlay');
  if (overlay) setTimeout(() => overlay.remove(), 2500);

  // Background pulse on the card (contained inside the box, not clipped).
  document.querySelectorAll('.match.match-jump-flash').forEach(m => m.classList.remove('match-jump-flash'));
  void target.offsetWidth;
  target.classList.add('match-jump-flash');
  setTimeout(() => target.classList.remove('match-jump-flash'), 2400);

    if (typeof node.getAttribute === 'function') {
      const v = node.getAttribute('data-jump');
      if (v) return { node: node, value: v };
    }
    node = node.parentNode;

document.addEventListener('click', (e) => {
  const hit = findDataJumpAncestor(e.target);
  if (!hit) return;
  e.preventDefault();
  jumpToMatch(hit.value);
}, true);  // capture phase so the viewer/staff click handlers don't pre-empt

/* ── Pan & scroll on bracket viewports ───────
 *  Drag with mouse, Shift+wheel, or arrow keys (when viewport focused).
 *  Touch pan is driven entirely in JS (one-finger drag → programmatic
 *  scroll of .page-scroll, with flick momentum). v0.91: we no longer
 *  rely on native touch scrolling of the nested .page-scroll container —
 *  iOS Safari does not reliably hand a touch-drag to a nested
 *  overflow:auto element when an ancestor (<body>) is position:fixed, so
 *  pan was dead on iPhone/iPad. .viewport gets touch-action:none and this
 *  handler owns every touch gesture, like a custom pan/zoom canvas. */
/* Horizontally pin the bracket section titles + tournament hero to the
 * viewport while the brackets pan beneath them. Each title's natural
 * position is at the scroll content's left (x=0). Applying
 *   transform: translateX(scrollLeft)
 * shifts the title rightward by the current horizontal scroll so its
 * effective screen position stays at viewport x=0, full viewport width.
 * Content inside is centered via flex/text-align so the pill/hero text
 * stays in the visible middle.

 * width (100vw) as its containing block — sticky needs the parent to be
 * larger than the element to have any range to stick in. */
let _pinTitlesBound = false;
function pinTitlesToViewport() {
  const ps = document.getElementById('pageScroll');
  if (!ps) return;
  const titles = () => document.querySelectorAll('.section-title, .hero');
  const apply = () => {
    const t = 'translateX(' + ps.scrollLeft + 'px)';
    titles().forEach(el => { el.style.transform = t; });
  };
  if (!_pinTitlesBound) {
    _pinTitlesBound = true;
    ps.addEventListener('scroll', apply, { passive: true });
  }
  apply();

/* Flick momentum for touch pan. One requestAnimationFrame loop, shared
 * across all viewports (only one finger-drag happens at a time). Velocity
 * arrives as finger px/ms; the bracket scrolls OPPOSITE the finger, so
 * scroll velocity = −finger velocity. It decays ~5%/frame until it falls
 * below a small threshold or the scroll hits a wall. Any new touch or
 * mouse drag cancels it so a fling never fights a fresh gesture. */

  if (_momentumRAF) { cancelAnimationFrame(_momentumRAF); _momentumRAF = 0; }

  let last = performance.now();

    const dt = Math.min(now - last, 50); last = now;   // cap stalls
    const beforeL = ps.scrollLeft, beforeT = ps.scrollTop;

    ps.scrollTop  = beforeT + sy * dt;

    if (ps.scrollTop  === beforeT) sy = 0;     // hit a vertical wall

function setupPanScroll() {
  document.querySelectorAll('.viewport').forEach(vp => {
    if (vp.dataset.panBound) return;
    vp.dataset.panBound = '1';
    vp.tabIndex = 0;

    // Omni-pan: track both X (viewport horizontal scroll) and Y (page-level
    // vertical scroll via the .page-scroll container) so click-drag on
    // desktop behaves like a touch-pan on an image — both axes move at once.
    let isDown = false, startX = 0, startY = 0, startLeft = 0, startTop = 0, moved = false;

      // own click handler via [data-jump] (SVG cross-source "L of M#" labels

      // viewport's mousedown starts a drag, micro-drift scrolls the wrap,
      // the label moves out from under the cursor, the synthesized click

      // Two-finger pinch.

        const dy = t.clientY - startY;

        if (ps) {

          ps.scrollTop  = startTop  - dy;

        const now = performance.now();
        const dt = now - lastMoveT;
        if (dt > 0) {
          velX = (t.clientX - lastMoveX) / dt;
          velY = (t.clientY - lastMoveY) / dt;
        }
        lastMoveX = t.clientX; lastMoveY = t.clientY; lastMoveT = now;
      }
    }, { passive: false });

    vp.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) { pinchStartDist = 0; pinchSvgEl = null; }
      if (e.touches.length === 1) {
        // Two fingers dropped to one — keep dragging with the survivor
        // instead of dead-stopping.
        beginPan(e.touches[0], true);
        return;
      }
      if (e.touches.length === 0) {
        // Stale-velocity guard: a flick that ended in a pause must not fling.
        if (performance.now() - lastMoveT > 100) { velX = 0; velY = 0; }
        if (panActive && moved) startMomentum(velX, velY);
        panActive = false;
      }
    }, { passive: true });

    vp.addEventListener('touchcancel', () => {
      panActive = false;
      pinchStartDist = 0;
      pinchSvgEl = null;
    }, { passive: true });
  });
}

/* ── Zoom (CSS transform: scale on each SVG) ─────
 *  Range 0.4–1.5. Persists in sessionStorage so a refresh doesn't reset.
 *  v0.90: zoom is a CSS `transform: scale(z)` on each .bracket-svg, NOT a
 *  resize of the SVG's CSS width/height. The SVG always renders at its
 *  natural design size (viewBox maps 1:1 to the SVG box), so WebKit
 *  positions the <foreignObject> cards correctly; the compositor then
 *  scales the whole painted layer. The old approach (resizing the SVG so
 *  its viewBox scaled internally) desynced foreignObject cards from the
 *  native connector lines on iOS Safari — cards drifted off their lines.
 *  No connector redraw needed — the entire SVG (lines + cards) is one
 *  layer scaled as a unit. Card "density" still keys off design × zoom
 *  via updateCardDensity(), since the foreignObject's own CSS width stays
 *  at the natural design width regardless of the transform. */
const ZOOM_MIN = 0.4, ZOOM_MAX = 1.5;
function clampZoom(z) { return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z)); }
function getZoom() {
  const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--zoom'));
  return Number.isFinite(z) && z > 0 ? z : 1;
}
function setZoom(z) {
  const next = clampZoom(Math.round(z * 100) / 100);
  document.documentElement.style.setProperty('--zoom', String(next));
  try { sessionStorage.setItem('breakoutZoom', String(next)); } catch (_e) {}
  const lbl = document.getElementById('zoomLabel');
  if (lbl) lbl.textContent = Math.round(next * 100) + '%';
  const zi = document.getElementById('zoomIn'),  zo = document.getElementById('zoomOut');
  if (zi) zi.disabled = next >= ZOOM_MAX - 0.001;
  if (zo) zo.disabled = next <= ZOOM_MIN + 0.001;
  applyZoomToSvgs();
}
function applyZoomToSvgs() {
  const z = getZoom();
  document.querySelectorAll('.bracket-svg').forEach(svg => {
    const sec = svg.closest('.bracket-section');
    if (!sec) return;
    const dw = parseFloat(sec.dataset.designW);
    const dh = parseFloat(sec.dataset.designH);
    if (!isFinite(dw) || !isFinite(dh)) return;
    // v0.90 — Fix 1: zoom via CSS transform, never a viewBox resize.
    // The SVG keeps its NATURAL design size (1:1 viewBox→box) so WebKit
    // lays out the <foreignObject> cards correctly; `transform: scale(z)`
    // then scales the finished layer. Resizing the SVG instead (old code)
    // forced viewBox scaling, which iOS Safari does not apply to
    // foreignObject content — cards drifted off their connector lines.
    svg.style.width  = dw + 'px';            // natural — NOT × zoom
    svg.style.height = dh + 'px';
    svg.style.transform = z === 1 ? 'none' : 'scale(' + z + ')';
    // The wrap is the zoom "sizer": an explicit box of design × zoom.
    // A CSS transform does not change layout size, so without this the
    // .page-scroll container would think every bracket is its natural
    // (un-zoomed) size. The natural-size SVG visually overflows this
    // smaller box at zoom < 1; .viewport's overflow:hidden clips it.
    const wrap = svg.closest('.bracket-wrap');
    if (wrap) {
      wrap.style.boxSizing = 'content-box';
      wrap.style.padding = '0';
      wrap.style.width  = (dw * z) + 'px';
      wrap.style.height = (dh * z) + 'px';
    }
  });
  updateCardDensity(z);
}

/* Card "density" classes: which content tier hides at this zoom level.
 * Same thresholds the old @container query used (220, 200, 180, 150, 130
 * effective px wide). Card design width is SVG.CARD_W. Effective render
 * width = CARD_W × on-screen-zoom. */
function updateCardDensity(zoom) {
  const z = zoom != null ? zoom : getZoom();
  const eff = SVG.CARD_W * z;
  const cls = [];
  if (eff <= 220) cls.push('cw-le-220');
  if (eff <= 200) cls.push('cw-le-200');
  if (eff <= 180) cls.push('cw-le-180');
  if (eff <= 150) cls.push('cw-le-150');
  if (eff <= 130) cls.push('cw-le-130');
  // Continuous font scale for team names: target ~ 6.5% of effective width,
  // clamp at the same min/max as the old clamp() rule.
  const namePx = Math.max(0.55 * 16, Math.min(0.92 * 16, 0.065 * eff));
  document.querySelectorAll('.match').forEach(el => {
    el.classList.remove('cw-le-220','cw-le-200','cw-le-180','cw-le-150','cw-le-130');
    if (cls.length) el.classList.add(...cls);
    el.style.setProperty('--name-size', namePx.toFixed(2) + 'px');
  });
}
function applyZoomDelta(delta, smooth) {
  setZoom(getZoom() + delta);
}
function initZoomToolbar() {
  // Restore prior zoom if any. Default: 0.7 on small screens so the whole
  // bracket fits without a frustrated zoom-out hunt.
  let initial = null;
  try { initial = parseFloat(sessionStorage.getItem('breakoutZoom')); } catch (_e) {}
  if (!Number.isFinite(initial)) initial = window.innerWidth < 700 ? 0.6 : 1;
  setZoom(initial);
  const zi = document.getElementById('zoomIn');
  const zo = document.getElementById('zoomOut');
  const zl = document.getElementById('zoomLabel');
  if (zi) zi.addEventListener('click', () => applyZoomDelta(+0.1));
  if (zo) zo.addEventListener('click', () => applyZoomDelta(-0.1));
  if (zl) zl.addEventListener('click', () => setZoom(1));
  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); applyZoomDelta(+0.1); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); applyZoomDelta(-0.1); }
    else if (e.key === '0') { e.preventDefault(); setZoom(1); }
  });
}

/* ── Print one bracket per page ──────────────
 *  Two buttons: landscape and portrait. Before window.print():
 *    1. Inject a temp <style> with @page { size: <orient> } so the browser
 *       paginates the correct way.
 *    2. Set --print-page-w and --print-page-h on :root in explicit inches
 *       matching the chosen orientation. The @media print rules use those
 *       variables to size each .bracket-section. 100vh fallback is
 *       unreliable in mobile print engines (the iOS/Android Chromium print
 *       paths sometimes resolve vh against the device screen height rather
 *       than the page content area), which made the mobile print render
 *       split each bracket across multiple pages.
 *    3. Letter content area (after 0.35in margins): 7.8in × 10.3in.
 *       Landscape: width = 10.3in, height = 7.8in.
 *    4. Restore @page + vars on afterprint. */
function preparePrint(orientation) {
  // Inject an @page orientation hint. Desktop respects it; mobile Chromium
  // tends to ignore the orientation portion and use the dialog default.
  // The print CSS is now robust to that — a hard 7in max-height on the
  // bracket-svg fits inside the page area in BOTH orientations, so even
  // when mobile renders portrait despite a landscape button tap, the
  // bracket doesn't overflow and split.
  const sty = document.createElement('style');
  sty.id = 'breakoutPrintStyle';
  sty.textContent = '@page { size: letter ' + orientation + '; margin: 0.35in; }';
  document.head.appendChild(sty);
}
function teardownPrint() {
  const sty = document.getElementById('breakoutPrintStyle');
  if (sty) sty.remove();
}
function firePrint(orient) {
  preparePrint(orient);
  const cleanup = () => { teardownPrint(); window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  // One tick lets the browser pick up the freshly-set --print-scale before
  // window.print() snapshots.
  setTimeout(() => window.print(), 30);
}
function initPrintButtons() {
  // Print button:
  //   • Desktop (hover-capable, mouse): popover with Landscape / Portrait.
  //     @page orientation hint is honored, so the choice actually takes
  //     effect.
  //   • Mobile / touch-only: skip the popover. The mobile Chromium /
  //     Samsung Internet print engines ignore the @page orientation hint
  //     anyway — the user picks orientation in the system dialog. Tapping
  //     the in-app orientation buttons just adds a misleading step.
  //     One tap on Print → fires directly (CSS handles either output
  //     orientation cleanly via the 7in max-height cap).
  const btn = document.getElementById('printBtn');
  const pop = document.getElementById('printPopover');
  const isTouchOnly = () =>
    window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  const openPopover = () => { if (pop) pop.hidden = false; };
  const closePopover = () => { if (pop) pop.hidden = true; };
  const togglePopover = () => { if (pop) pop.hidden = !pop.hidden; };
  if (btn && pop) {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isTouchOnly()) {
        closePopover();
        firePrint('landscape');
      } else {
        togglePopover();
      }
    });
    pop.addEventListener('click', (e) => {
      const opt = e.target.closest('.print-popover-opt');
      if (!opt) return;
      const orient = opt.dataset.orient;
      closePopover();
      firePrint(orient === 'portrait' ? 'portrait' : 'landscape');
    });
    document.addEventListener('click', (e) => {
      if (pop.hidden) return;
      if (e.target.closest('#printPopover, #printBtn')) return;
      closePopover();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !pop.hidden) { closePopover(); btn.focus(); }
    });
  }
  // Intercept Ctrl+P / Cmd+P → run our fit-to-page logic (landscape default).
  // Capture phase so we beat the browser's native print binding.
  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key !== 'p' && e.key !== 'P') return;
    e.preventDefault();
    e.stopPropagation();
    firePrint('landscape');
  }, true);
}

/* ── Boot ──────────────────────────────────── */
(async () => {
  initZoomToolbar();
  initPrintButtons();
  try { await loadTeams(); }
  catch (e) {
    document.getElementById('tournamentRoot').innerHTML = '<p style="padding:30px;color:var(--danger);font-weight:700">Could not load teams: ' + esc(e.message) + '</p>';
    return;
  }
  setupStaffMode();
  try { _tournament = await buildTournament(); }
  catch (e) {
    document.getElementById('tournamentRoot').innerHTML = '<p style="padding:30px;color:var(--danger);font-weight:700">' + esc(e.message) + '</p>';
    return;
  }
  renderTournament();
})();
</script>
</body>
</html>
